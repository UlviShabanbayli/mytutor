<link rel="preconnect" href="https://fonts.googleapis.com">

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
/* Layout: one column of sample cards (stage on top, decision at the bottom), sticky toolbar,
   category chips that scroll the page. Tokens = the app's palette B "Ağ pətək". */
:root {
  --page: #F6F7F9; --surf: #FFFFFF; --raised: #FFF5DB; --box: #EEF0F4; --slat: #FFFFFF;
  --slat-edge: #DADDE5; --ink: #141824; --muted: #5A6170; --border: #E4E7EC;
  --honey: #FFB800; --honey-deep: #D99A00; --honey-text: #7E5600; --nectar: #FFE08A;
  --on-nectar: #141824; --wax: #ECEEF2; --cap: #FFF3CC; --on-honey: #141824; --lock-ink: #626977;
  --info: #2560C4; --info-bg: #E9F0FC; --ok: #0A7A4F; --ok-bg: #E4F5EC; --err: #C42F38;
  --err-bg: #FDECEC; --crystal: #E3EAF5; --crystal-ink: #34507A; --sealed: #D99A00;
  --on-sealed: #141824; --spot: #141824; --on-spot: #FFFFFF; --shadow: rgba(20,24,36,0.08);
  --scrim: rgba(13,15,20,0.45);
  --display: 'Unbounded', 'Onest', system-ui, sans-serif;
  --body: 'Onest', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: ui-monospace, 'SF Mono', Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --page: #0D0F14; --surf: #171A21; --raised: #20242D; --box: #12151B; --slat: #1C2028;
  --slat-edge: #2B303B; --ink: #F2F4F7; --muted: #A4ABB8; --border: #2A2F3A;
  --honey: #FFC233; --honey-deep: #C99418; --honey-text: #FFD466; --nectar: #6E5718;
  --on-nectar: #FFF1C9; --wax: #2A2F3A; --cap: #FFE7A8; --on-honey: #0D0F14; --lock-ink: #9AA1AF;
  --info: #8DB4FF; --info-bg: #182338; --ok: #4FD3A0; --ok-bg: #11302A; --err: #FF8A80;
  --err-bg: #3A1A1F; --crystal: #233049; --crystal-ink: #B7CBF0; --sealed: #C99418;
  --on-sealed: #0D0F14; --spot: #262B36; --on-spot: #F2F4F7; --shadow: rgba(0,0,0,0.35);
  --scrim: rgba(0,0,0,0.6); color-scheme: dark; } }
:root[data-theme="dark"] {
  --page: #0D0F14; --surf: #171A21; --raised: #20242D; --box: #12151B; --slat: #1C2028;
  --slat-edge: #2B303B; --ink: #F2F4F7; --muted: #A4ABB8; --border: #2A2F3A;
  --honey: #FFC233; --honey-deep: #C99418; --honey-text: #FFD466; --nectar: #6E5718;
  --on-nectar: #FFF1C9; --wax: #2A2F3A; --cap: #FFE7A8; --on-honey: #0D0F14; --lock-ink: #9AA1AF;
  --info: #8DB4FF; --info-bg: #182338; --ok: #4FD3A0; --ok-bg: #11302A; --err: #FF8A80;
  --err-bg: #3A1A1F; --crystal: #233049; --crystal-ink: #B7CBF0; --sealed: #C99418;
  --on-sealed: #0D0F14; --spot: #262B36; --on-spot: #F2F4F7; --shadow: rgba(0,0,0,0.35);
  --scrim: rgba(0,0,0,0.6); color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--page); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; margin: 0; }
button, textarea { font: inherit; }
:focus-visible { outline: 3px solid var(--honey); outline-offset: 2px; }

.lab { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 64px; display: flex; flex-direction: column; gap: 28px; }
.lab-head { display: flex; flex-direction: column; gap: 10px; padding-block: 28px 4px; }
.lab-head h1 { margin: 0; font-family: var(--display); font-size: clamp(26px, 6vw, 36px); font-weight: 800; line-height: 1.1; text-wrap: balance; }
.lab-head p { margin: 0; color: var(--muted); max-width: 62ch; }
.toolbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--page); border-bottom: 1px solid var(--border); padding-block: 10px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.chip { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--surf); color: var(--ink); font-weight: 700; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--spot); color: var(--on-spot); border-color: var(--spot); }
.chip .count { font-variant-numeric: tabular-nums; color: var(--honey-text); }
.chip[aria-pressed="true"] .count { color: var(--honey); }
.toolbar .grow { flex: 1; }
.progress { font-size: 13px; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }

.lab-section { display: flex; flex-direction: column; gap: 16px; scroll-margin-top: 80px; }
.lab-section > h2 { margin: 12px 0 0; font-family: var(--display); font-size: 22px; font-weight: 800; }
.lab-section > .lead { margin: -8px 0 0; color: var(--muted); max-width: 62ch; }

.sample { background: var(--surf); border: 1px solid var(--border); border-radius: 20px; overflow: hidden; display: flex; flex-direction: column; scroll-margin-top: 80px; }
.sample-head { padding: 16px 16px 0; display: flex; flex-direction: column; gap: 4px; }
.sample-head h3 { margin: 0; font-size: 17px; font-weight: 800; }
.sample-head .when { color: var(--muted); font-size: 13px; }
.variants { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 16px 0; }
.variant { min-height: 36px; padding: 0 12px; border-radius: 10px; border: 2px solid var(--border); background: transparent; color: var(--ink); font-weight: 700; font-size: 13px; cursor: pointer; }
.variant[aria-pressed="true"] { border-color: var(--honey); background: var(--raised); }
.variant .tag { font-weight: 800; margin-right: 4px; }
.stage-wrap { position: relative; margin: 12px 16px 0; border-radius: 16px; background: var(--box); min-height: 260px; overflow: hidden; display: flex; }
.stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; position: relative; min-width: 0; }
.replay { position: absolute; right: 8px; top: 8px; z-index: 2; min-height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surf); color: var(--ink); font-weight: 700; font-size: 12px; cursor: pointer; }
.spec-box { margin: 10px 16px 0; }
.spec-box summary { cursor: pointer; min-height: 32px; display: flex; align-items: center; font-size: 13px; font-weight: 700; color: var(--muted); }
.spec { margin: 4px 0 0; font-family: var(--mono); font-size: 12px; color: var(--muted); line-height: 1.5; }
/* Phones: the toolbar is one row that scrolls sideways instead of six wrapped rows over the cards. */
@media (max-width: 640px) {
  .toolbar { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; }
  .toolbar::-webkit-scrollbar { display: none; }
  .toolbar .chip, .toolbar .progress { flex: none; }
  .toolbar .grow { display: none; }
}
.decide { margin: 14px 16px 16px; padding-top: 12px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
.decide-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.decide button { min-height: 40px; padding: 0 14px; border-radius: 12px; font-weight: 800; font-size: 13px; cursor: pointer; border: 2px solid var(--border); background: transparent; color: var(--ink); }
.decide .approve { background: var(--honey); border-color: var(--honey); color: var(--on-honey); box-shadow: 0 3px 0 var(--honey-deep); }
.decide .approve[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: var(--surf); box-shadow: none; }
.decide .change[aria-pressed="true"] { border-color: var(--err); color: var(--err); }
.decide textarea { width: 100%; min-height: 64px; border-radius: 12px; border: 2px solid var(--border); background: var(--page); color: var(--ink); padding: 10px; resize: vertical; }
.decide .state { font-size: 12px; font-weight: 700; color: var(--muted); }
.decide .state.ok { color: var(--ok); }
.decide .state.updated { color: var(--honey-text); }
.sample.is-updated { border: 2px solid var(--honey); box-shadow: 0 0 0 4px var(--raised); }
.chip[hidden] { display: none; }
.chip-updated { background: var(--honey); border-color: var(--honey); color: var(--on-honey); }
.chip-updated .count { color: var(--on-honey); }
.empty-note { color: var(--muted); font-size: 13px; }

@media (prefers-reduced-motion: reduce) { .lab * { scroll-behavior: auto; } }
</style>

<div class="lab">
  <header class="lab-head">
    <h1>arı · hərəkət laboratoriyası</h1>
    <p>Hər kart bir hərəkətdir: Vızı, düymələr, cavab anları, hüceyrələr, ekran keçidləri və xırda detallar. Variantlara baxın, birini seçib təsdiqləyin və ya nəyin dəyişməli olduğunu yazın. Seçimləriniz yadda qalır.</p>
  </header>
  <nav class="toolbar" aria-label="Bölmələr və görünüş">
    <button class="chip chip-updated" id="updated" type="button" hidden>Yenilənənlər <span class="count">0</span></button>
    <div id="cats" style="display: contents"></div>
    <span class="grow"></span>
    <button class="chip" id="reduced" type="button" aria-pressed="false">Hərəkəti azalt</button>
    <button class="chip" id="theme" type="button" aria-pressed="false">Tünd</button>
    <span class="progress" id="progress" aria-live="polite"></span>
  </nav>

<script>
// The Lab API exists before the sections, so their scripts may call Lab.register / Lab.vizi /
// Lab.reduced while the page loads; the runtime at the end reuses the same registry.
(function () {
  let uid = 0;
  window.Lab = {
    _mounts: new Map(),
    _reduced: matchMedia('(prefers-reduced-motion: reduce)').matches,
    /** Static mascot art of one mood as an SVG string (moods: hero salam sevinc bayram dusunur izah fokus teeccub teselli darixdim yuxulu ucur kesfiyyat). */
    vizi(mood, size) {
      const svg = (window.VIZI_MOODS || {})[mood] || '';
      return svg.replaceAll('__S__', String(size || 120)).replaceAll('__ID__', 'vz' + (++uid));
    },
    /** A sample's script: mount(stage, variant, {reduced}) runs on show and replay; may return cleanup. */
    register(id, mount) { window.Lab._mounts.set(id, mount); },
    reduced: () => window.Lab._reduced,
  };
})();
</script>

  /* ---------- idle life ---------- */

  /* ---------- stage helpers ---------- */
  const DROP = '<svg viewBox="0 0 24 30" aria-hidden="true"><path d="M12 1C12 1 3 12 3 19.5a9 9 0 0 0 18 0C21 12 12 1 12 1Z" style="fill: var(--honey)"/><ellipse cx="8.4" cy="19" rx="2.3" ry="3.6" style="fill: rgba(255,255,255,0.45)"/></svg>';
  function rel(el, sc) { const a = el.getBoundingClientRect(), b = sc.getBoundingClientRect(); return { x: a.left - b.left, y: a.top - b.top, w: a.width, h: a.height, cx: a.left - b.left + a.width / 2, cy: a.top - b.top + a.height / 2 }; }

  function say(S, R, el, text) {

  /* ---------- samples ---------- */
  const SAMPLES = {};

  // 1. Idle
  def('idle', (sc, v, R, S) => {
    const r = rigIn(sc, S, R, '.m-vizi-host', 'rest', { pivots: true });
    life(r, v === 'A' ? { hover: 4 } : v === 'B' ? { hover: 4, look: true } : { hover: 7, hoverDur: 1.25, flap: 'busy', look: true, fidget: true });
    const b = sc.querySelector('.m-vizi-chip');
    if (b) S.on(b, 'click', () => { const on = b.getAttribute('aria-pressed') !== 'true'; b.setAttribute('aria-pressed', String(on)); b.textContent = on ? 'Oynaqları gizlət' : 'Oynaqları göstər'; r.g.pivots.style.display = on ? '' : 'none'; });

  // 2. Tap
  const GIGGLE = ['Hi-hi! Qıdığım gəlir!', 'Yenə? Hi-hi-hi!', 'Vay, başım fırlandı!', 'Bəsdir, gəl dərsə qayıdaq!'];
  function tapSmile(r) {

      .to(sq, { scaleY: 1, scaleX: 1, duration: 0.16 }, 0.3)

  });

  // 4. Correct answer
  function cellsPop(sc, S, from) {

      const e = hexEl(sc, 'is-s ' + c[1]); e.style.left = (from.cx + c[0] * from.w * 0.62 - 20) + 'px'; e.style.top = (from.cy - 30) + 'px';
      const tl = S.tl({ delay: i * 0.08 });

        .to(e, { opacity: 0, duration: 0.3 }, 0.6)

    });
  }
  def('correct', (sc, v, R, S) => {

      tl.add(face(r, 'sevinc', { d: 0.18 }), 0.2)
        .add(hop(r, 10), 0.25)

  // Run a timeline builder again and again with fresh tweens (safer than repeat: -1 for pose morphs).
  function loop(S, build, gap) {
    const run = () => { const tl = build(); if (!tl) return; tl.eventCallback('onComplete', () => S.after(gap || 0, run)); };
    run();
  }

        .set(r.g.spin, { rotation: 0 }, 1.23)
        .to(sq, { y: 0, duration: 0.4, ease: 'power2.in' }, 0.77)

  // 7. Thinking (AI working)

    if (v === 'A') {
      const dots = [...sc.querySelectorAll('.m-vizi-tdot')];
      const r = rigIn(sc, S, R, '.m-vizi-host', 'dusunur'); life(r, { hover: 3, flap: 'rest' });
      if (R) { G.set(dots, { opacity: 0.7 }); return; }
      S.tl({ repeat: -1 }).to(dots, { scale: 1.3, opacity: 1, duration: 0.3, ease: 'sine.out', stagger: 0.22 }, 0)
        .to(dots, { scale: 1, opacity: 0.35, duration: 0.3, ease: 'sine.in', stagger: 0.22 }, 0.3).to({}, { duration: 0.25 });
      S.add(G.to(r.g.antR, { rotation: 8, duration: 1.4, ease: 'sine.inOut', yoyo: true, repeat: -1 }));
      const fid = () => S.after(rand(2, 3.5), () => { look(r, rand(-3, 3), rand(-2, 2), 0.25); S.add(mouth(r, pick(['hmm', 'flat', 'hmm']), 0.2)); fid(); });

    } else if (v === 'B') {
      const r = rigIn(sc, S, R, '.m-vizi-host', 'rest'); life(r, { hover: 3, flap: 'rest' });

      if (R) return;
      [r.g.sgL, r.g.sgR].forEach((c, i) => S.add(G.fromTo(c, { attr: { r: 9, 'stroke-width': 3 }, opacity: 0.9 }, { attr: { r: 26, 'stroke-width': 1 }, opacity: 0, duration: 1.1, ease: 'power1.out', repeat: -1, delay: i * 0.55 })));
      const pts = [[-6, -1], [0, -1], [6, -1], [-6, 3], [0, 3], [6, 3]];
      loop(S, () => {
        const tl = S.tl(), end = pts.length * 0.32;
        pts.forEach((p, i) => tl.add(look(r, p[0], p[1], 0.22), i * 0.32));
        tl.add(look(r, 0, 0, 0.3), end + 0.2).call(() => blink(r), null, end + 0.5).to({}, { duration: 0.5 }, end + 0.5);
        return tl;
      }, 0.2);
    } else {
      const fills = [...sc.querySelectorAll('.m-vizi-think .m-vizi-fill')];
      const r = rigIn(sc, S, R, '.m-vizi-host', 'fokus'); life(r, { hover: 3, flap: 'rest' });
      if (R) { G.set(fills.slice(0, 2), { scaleY: 1 }); return; }
      loop(S, () => {
        const tl = S.tl();
        fills.forEach((fl, i) => { tl.add(look(r, 3 + i * 3, 3, 0.25), i * 0.6).to(fl, { scaleY: 1, duration: 0.5, ease: 'power1.inOut' }, i * 0.6 + 0.05); });
        tl.call(() => blink(r), null, 1.9).add(look(r, 0, 0, 0.3), 2).to(fills, { opacity: 0, duration: 0.25 }, 2.3).set(fills, { scaleY: 0, opacity: 1 }, 2.6);
        return tl;
      }, 0.2);

  });

  // 8. Explaining
  def('explain', (sc, v, R, S) => {
    const steps = [...sc.querySelectorAll('.m-vizi-step')];
    const on = (i) => steps.forEach((s, j) => { s.classList.toggle('is-on', j === i); });
    if (v === 'A') {
      const r = rigIn(sc, S, R, '.m-vizi-host', 'izah'); life(r, { hover: 3 });
      const aim = (el) => {
        const h = rel(r.host, sc), e = rel(el, sc), s = r.size / 200, tx = (e.x + 14 - h.x) / s, ty = (e.cy - h.y) / s;
        const a = Math.atan2(ty - 112, tx - 170) - Math.atan2(94 - 112, 262 - 170);
        return Math.max(-40, Math.min(45, a * 57.2958));
      };
      const angles = steps.map(aim);
      if (R) { G.set(r.g.armR, { rotation: angles[2] }); on(2); return; }
      loop(S, () => {
        const tl = S.tl();
        steps.forEach((el, i) => {
          const t = i * 2.3;
          tl.to(r.g.armR, { rotation: angles[i], duration: 0.4, ease: 'power2.inOut' }, t)
            .add(look(r, 3, i * 3 - 2, 0.25), t)
            .to(r.g.armR, { rotation: angles[i] + 5, duration: 0.1, yoyo: true, repeat: 1, ease: 'power1.inOut' }, t + 0.42)
            .call(() => on(i), null, t + 0.45)
            .add(talk(r, 1.1, 'smile'), t + 0.5)
            .add(look(r, 0, 0, 0.3), t + 1.75)
            .to(r.g.brows, { y: -4, duration: 0.15, yoyo: true, repeat: 1 }, t + 1.8);
        });
        tl.call(() => on(-1), null, 7).to(r.g.armR, { rotation: 0, duration: 0.4 }, 7).to({}, { duration: 0.8 }, 7.4);
        return tl;
      }, 0);
    } else if (v === 'B') {
      const r = rigIn(sc, S, R, '.m-vizi-host', 'point'); life(r, { hover: 3 });
      const h0 = rel(r.host, sc), ys = steps.map((el) => rel(el, sc).cy - h0.cy - 4 * r.size / 200);
      if (R) { G.set(r.host, { y: ys[0] }); on(0); return; }
      G.set(r.host, { y: ys[0] });
      loop(S, () => {
        const tl = S.tl();
        steps.forEach((el, i) => {
          const t = i * 2.5;
          tl.to(r.host, { y: ys[i], duration: 0.5, ease: 'power2.inOut' }, t)
            .call(() => flapBurst(r, 0.55), null, t)
            .to(r.g.spin, { rotation: 6, duration: 0.25, ease: 'sine.out', yoyo: true, repeat: 1 }, t)
            .call(() => on(i), null, t + 0.5)
            .add(look(r, 3, 0, 0.2), t + 0.45)
            .to(r.g.armR, { rotation: -6, duration: 0.12, yoyo: true, repeat: 1 }, t + 0.5)
            .add(talk(r, 1, 'smile'), t + 0.6)
            .add(look(r, 0, 0, 0.3), t + 1.7)
            .to(r.g.brows, { y: -4, duration: 0.15, yoyo: true, repeat: 1 }, t + 1.75)
            .to(r.g.squash, { y: 3, duration: 0.15, yoyo: true, repeat: 1, ease: 'sine.inOut' }, t + 2.15);
        });
        tl.call(() => on(-1), null, 7.5).to(r.host, { y: ys[0], duration: 0.6, ease: 'power2.inOut' }, 7.5).to({}, { duration: 0.6 }, 8.1);
        return tl;
      }, 0);
    } else {
      const words = [...sc.querySelectorAll('.m-vizi-words span')], bars = [...sc.querySelectorAll('.m-vizi-wave i')];
      const r = rigIn(sc, S, R, '.m-vizi-host', 'rest'); life(r, { hover: 3 });
      if (R) { words.forEach((w) => w.classList.add('is-done')); setFace(r, 'happy'); return; }
      setFace(r, 'izah');
      loop(S, () => {
        const tl = S.tl(), per = 0.38, total = words.length * per;
        tl.call(() => words.forEach((w) => w.classList.remove('is-on', 'is-done')), null, 0);
        words.forEach((w, i) => tl.call(() => words.forEach((x, j) => { x.classList.toggle('is-on', j === i); x.classList.toggle('is-done', j < i); }), null, 0.3 + i * per));
        tl.add(talk(r, total, 'smile'), 0.3)
          .to(bars, { scaleY: () => rand(0.3, 1), duration: 0.1, ease: 'none', repeat: Math.round(total / 0.1), repeatRefresh: true, stagger: 0.02 }, 0.3)
          .to(bars, { scaleY: 0.3, duration: 0.2 }, 0.45 + total)
          .call(() => words.forEach((x) => { x.classList.remove('is-on'); x.classList.add('is-done'); }), null, 0.3 + total)
          .add(face(r, 'happy', { d: 0.3 }), 0.4 + total)
          .to({}, { duration: 1.2 }, 0.5 + total)
          .add(face(r, 'izah', { d: 0.2 }), 1.6 + total);
        return tl;
      }, 0);
    }
  });

  // 9. Loading flight
  def('loading', (sc, v, R, S) => {
    if (v === 'A') {
      const r = rigIn(sc, S, R, '.m-vizi-host', 'ucur'); life(r, { hover: 0, flap: 'fly' });
      if (R) return;
      speed(r, 'L');
      const W = sc.getBoundingClientRect().width, h = r.host;
      G.set(h, { rotation: -10 });
      S.add(G.fromTo(h, { x: -(W / 2 + 90) }, { x: W / 2 + 90, duration: 2.6, ease: 'none', repeat: -1, repeatDelay: 0.3 }));
      S.add(G.to(h, { y: -10, duration: 0.42, ease: 'sine.inOut', yoyo: true, repeat: -1 }));
    } else if (v === 'B') {
      const r = rigIn(sc, S, R, '.m-vizi-host', 'ucur'); life(r, { hover: 0, flap: 'fly' });
      if (R) return;
      const W = sc.getBoundingClientRect().width, A = Math.min(150, W * 0.32), B = 30, h = r.host, p = { t: 0 };
      let dir = 1; let fast = null;
      S.add(G.to(p, {
        t: Math.PI * 2, duration: 3.4, ease: 'none', repeat: -1,
        onUpdate() {
          const c = Math.cos(p.t), nd = c >= 0 ? 1 : -1;
          G.set(h, { x: A * Math.sin(p.t), y: B * Math.sin(2 * p.t), rotation: -10 * nd });
          if (nd !== dir) { dir = nd; S.add(G.to(h, { scaleX: nd, duration: 0.15, ease: 'power1.inOut', overwrite: 'auto' })); }
          const fs = Math.abs(c) > 0.55; if (fs !== fast) { fast = fs; speed(r, fs ? 'L' : null); }
        },
      }));
    } else {
      const fl = [...sc.querySelectorAll('.m-vizi-flower')], bar = sc.querySelector('.m-vizi-bar i'), lab = sc.querySelector('.m-vizi-load-t b');
      const r = rigIn(sc, S, R, '.m-vizi-host', 'ucur'); life(r, { hover: 3, flap: 'fly' });
      if (R) { G.set(bar, { scaleX: 0.67 }); lab.textContent = '67%'; setPose(r, 'rest'); return; }
      const h0 = rel(r.host, sc), s = r.size / 200;
      const tgt = fl.map((f) => { const e = rel(f, sc); return { x: e.cx - h0.cx, y: e.y - 22 - 90 * s - h0.cy }; });
      G.set(r.host, { x: tgt[0].x, y: tgt[0].y - 30 });
      loop(S, () => {
        const tl = S.tl();
        tl.call(() => { lab.textContent = '0%'; }, null, 0).to(bar, { scaleX: 0, duration: 0.2 }, 0);
        fl.forEach((f, i) => {

            .to(r.host, { keyframes: [{ y: q.y - 34, duration: 0.35, ease: 'power2.out' }, { y: q.y, duration: 0.35, ease: 'power2.in' }] }, t)
            .to(r.host, { rotation: -10, duration: 0.2 }, t).to(r.host, { rotation: 0, duration: 0.3 }, t + 0.55)
            .to(r.g.squash, { y: 6, duration: 0.2, yoyo: true, repeat: 1, ease: 'sine.inOut' }, t + 0.75)
            .fromTo(f, { scaleY: 1 }, { scaleY: 0.82, duration: 0.18, yoyo: true, repeat: 1, ease: 'sine.inOut', immediateRender: false }, t + 0.8)
            .call(() => {
              const e = rel(f, sc), b = rel(bar.parentNode, sc);
              flyDrop(sc, S, { x: e.cx, y: e.y }, { x: b.x + b.w * (i + 1) / 3, y: b.cy }, () => {
                S.add(G.to(bar, { scaleX: (i + 1) / 3, duration: 0.4, ease: 'power2.out' }));
                tick(S, lab, Math.round(i * 33.34), Math.round((i + 1) * 33.34), 0.4, (n) => n + '%');
              }, { dur: 0.5, arc: 20, size: 14 });
            }, null, t + 0.95);
        });
        tl.add(face(r, 'sevinc', { d: 0.2 }), 5).add(hop(r, 12), 5).add(face(r, 'ucur', { d: 0.3 }), 5.8)
          .to(r.host, { x: tgt[0].x, duration: 0.9, ease: 'power2.inOut' }, 6)
          .to(r.host, { keyframes: [{ y: tgt[0].y - 40, duration: 0.45, ease: 'power2.out' }, { y: tgt[0].y - 30, duration: 0.45, ease: 'power2.in' }] }, 6)
          .to({}, { duration: 0.3 }, 6.9);
        return tl;
      }, 0);
    }
  });

  // 10. Sleepy / offline
  function zz(sc, S, r, n) {
    for (let i = 0; i < (n || 1); i++) {
      const h = rel(r.host, sc), z = document.createElement('span');
      z.className = 'm-vizi-z'; z.textContent = 'z'; z.setAttribute('aria-hidden', 'true');
      z.style.fontSize = rand(14, 22) + 'px'; z.style.left = (h.x + h.w * 0.74) + 'px'; z.style.top = (h.y + h.h * 0.1) + 'px';

          .call(() => { speed(r, null); flap(r, 'calm'); setPose(r, 'rest'); }, null, 0.6);
      } else {
        cur.to(r.g.root, { scale: 1.08, duration: 0.1, ease: 'power1.out' }, 0)
          .to(r.g.root, { scale: 0, rotation: 10, duration: 0.2, ease: 'back.in(2)' }, 0.1)
          .set(h, { opacity: 0 }, 0.32).set(r.g.root, { rotation: 0 }, 0.32);
      }
    };
    S.on(btn, 'click', () => { auto.forEach((a) => a.kill()); auto = []; if (shown) exit(); else enter(); });
    auto = [S.after(0.3, enter), S.after(2.6, exit), S.after(3.6, enter)];
  });

  /* ---------- registration ---------- */
  function registerAll() {
    Object.keys(SAMPLES).forEach((id) => {
      window.Lab.register(id, (stage, v, opt) => {
        const sc = stage.querySelector('.m-vizi-scene'); if (!sc) return undefined;
        if (!G) { sc.querySelectorAll('.m-vizi-host').forEach((h) => { const s = place(h); h.innerHTML = window.Lab.vizi('hero', s); }); sc.querySelectorAll('.m-vizi-bubble, .m-vizi-found').forEach((b) => { b.style.opacity = '1'; }); return undefined; }
        const S = scope(); const R = !!(opt && opt.reduced);
        try { SAMPLES[id](sc, v, R, S); } catch (e) { console.error(id, e); }
        let io = null;
        if ('IntersectionObserver' in window) { io = new IntersectionObserver((es) => { es.forEach((e) => { if (e.isIntersecting) S.play(); else S.pause(); }); }); io.observe(stage); }
        return () => { if (io) io.disconnect(); S.kill(); };
      });
    });
  }
  function boot() {
    if (!window.Lab || !window.Lab.register) return false;
    registerAll();
    // If the shell already built the cards (script ran late), remount this section's samples.
    document.querySelectorAll('#sec-vizi .replay').forEach((b) => b.click());
    return true;
  }
  if (!boot()) document.addEventListener('DOMContentLoaded', boot, { once: true });
})();
</script>

<style>
/* ---- Buttons and touch: shared frame ---- */

.m-buttons-screen button:disabled { cursor: default; }
.m-buttons-hint { margin: 0; text-align: center; font-size: 12px; font-weight: 700; color: var(--muted); }
.m-buttons-phone .m-buttons-hint { padding: 10px 16px 12px; background: var(--surf); }
.m-buttons-ico { fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; display: block; }
.m-buttons-caps { font-size: 11px; font-weight: 800; letter-spacing: 0.08em; color: var(--muted); }
.m-buttons-q { margin: 0; font-size: 16px; font-weight: 700; line-height: 1.4; }
.m-buttons-src { margin: 0; display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; line-height: 1.35; color: var(--muted); }
.m-buttons-haptic { position: absolute; left: 10px; top: 14px; z-index: 2; padding: 3px 10px; border-radius: 999px; background: var(--surf); border: 1px solid var(--border); color: var(--honey-text); font-family: var(--mono); font-size: 11px; font-weight: 700; line-height: 1.5; opacity: 0; transform: translateY(-4px); transition: opacity 150ms ease-out, transform 150ms ease-out; pointer-events: none; }
.m-buttons-haptic.is-on { opacity: 1; transform: none; }

/* ---- Raised button: face on a 4px honey-deep edge ---- */
.m-buttons-raised { position: relative; display: block; width: 100%; padding: 0 0 4px; border: 0; border-radius: 16px; background: transparent; color: var(--on-honey); text-align: center; }
.m-buttons-edge { position: absolute; left: 0; right: 0; top: 4px; bottom: 0; border-radius: inherit; background: var(--honey-deep); transition: opacity 220ms ease-out; }
.m-buttons-face { position: relative; height: 56px; border-radius: inherit; background: var(--honey); color: var(--on-honey); display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 800; letter-spacing: 0.04em; overflow: hidden; transform-origin: 50% 100%; }

/* ---- Spot card ---- */
.m-buttons-spot { border-radius: 20px; }

.m-buttons-go { width: 52px; height: 52px; border-radius: 16px; background: var(--honey); color: var(--on-honey); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

/* ---- Flat controls ---- */

/* ---- Loading ---- */

.m-buttons-layer { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 8px; transition: opacity 120ms ease-out, transform 120ms ease-out; }
.m-buttons-busy, .m-buttons-done { opacity: 0; transform: translateY(6px); }

.m-buttons-send.is-done .m-buttons-busy { opacity: 0; transform: translateY(-6px); }
.m-buttons-dots, .m-buttons-cells { display: flex; align-items: center; gap: 6px; }
.m-buttons-dots i { display: block; width: 8px; height: 8px; border-radius: 4px; background: var(--on-honey); opacity: 0.45; }
.m-buttons-send.is-busy .m-buttons-dots i { animation: m-buttons-dot 900ms ease-in-out infinite; }
.m-buttons-send.is-busy .m-buttons-dots i:nth-child(2) { animation-delay: 120ms; }
.m-buttons-send.is-busy .m-buttons-dots i:nth-child(3) { animation-delay: 240ms; }
@keyframes m-buttons-dot { 0%, 60%, 100% { transform: translateY(0); opacity: 0.45; } 30% { transform: translateY(-4px); opacity: 1; } }
.m-buttons-cells i { position: relative; display: block; width: 14px; height: 16px; overflow: hidden; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); background: color-mix(in srgb, var(--on-honey) 22%, transparent); }

/* ---- Tab bar ---- */

.m-buttons-tip-t b { font-size: 11px; font-weight: 800; letter-spacing: 0.08em; color: var(--honey-text); }

/* ---- Reduced motion: no loops, no travel; state changes become plain 150ms fades ---- */
:root[data-reduced] .m-buttons-dots i, :root[data-reduced] .m-buttons-cells i::after { animation: none !important; }
:root[data-reduced] .m-buttons-dots i:nth-child(1) { opacity: 1; }
:root[data-reduced] .m-buttons-dots i:nth-child(2) { opacity: 0.6; }
:root[data-reduced] .m-buttons-dots i:nth-child(3) { opacity: 0.3; }

:root[data-reduced] .m-buttons-cells i:nth-child(2)::after { opacity: 0.6; }
:root[data-reduced] .m-buttons-cells i:nth-child(3)::after { opacity: 0.3; }

:root[data-reduced] .m-buttons-screen *, :root[data-reduced] .m-buttons-phone * { transition-duration: 150ms !important; }
</style>
<script>
// Buttons and touch samples. A tiny Reanimated-like layer (interruptible withSpring /
// withTiming on plain numbers) so each web demo uses the same numbers as its RN spec.
(function () {
  'use strict';

  const EASE = {
    linear: (p) => p,
    quadOut: (p) => 1 - (1 - p) * (1 - p),
    out: (p) => 1 - Math.pow(1 - p, 3),
    inOut: (p) => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2),
  };
  const VIBRATE = { Light: 8, Medium: 14, Selection: 4, Success: [8, 70, 12] };
  const PRESS_SPRING = { damping: 12, stiffness: 320, mass: 0.7 };
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const f2 = (n) => n.toFixed(2);
  const f3 = (n) => n.toFixed(3);

  /** Per-mount helpers; everything they start is stopped by cleanup(). */
  function kit(stage, reduced) {
    const timers = new Set();
    const demos = new Set();
    const offs = [];
    const values = new Set();
    const k = {
      reduced,
      q: (s) => stage.querySelector(s),
      qa: (s) => Array.from(stage.querySelectorAll(s)),
      later(fn, ms) {
        const id = setTimeout(() => { timers.delete(id); fn(); }, ms);
        timers.add(id);
        return id;
      },
      clear(id) { if (id) { clearTimeout(id); timers.delete(id); } },
      on(el, type, fn, opt) { el.addEventListener(type, fn, opt); offs.push(() => el.removeEventListener(type, fn, opt)); },
      observe(el, fn) {
        if (!window.ResizeObserver) return;
        const ro = new ResizeObserver(() => fn());
        ro.observe(el);
        offs.push(() => ro.disconnect());
      },
      /** A scripted first play; any real touch inside the stage cancels what is still pending. */
      demo(ms, fn) {
        const id = k.later(() => { demos.delete(id); fn(); }, ms);
        demos.add(id);
      },
      demoPress(down, up, at, hold) {
        const t = at || 650;
        k.demo(t, () => down(null));
        k.demo(t + (hold || 170), () => up(null, true));
      },
      stopDemo() { demos.forEach((id) => k.clear(id)); demos.clear(); },
      /** Animated number (like a shared value): set / timing / spring / fade, interruptible. */
      value(apply, init) {
        let x = init || 0;
        let vel = 0;
        let raf = 0;
        let token = null;
        const stop = () => { if (raf) cancelAnimationFrame(raf); raf = 0; token = null; };
        const run = (step, done) => {
          stop();
          const me = {};
          token = me;
          let last = performance.now();
          const frame = (t) => {
            if (token !== me) return;
            const dt = clamp((t - last) / 1000, 0, 0.034);
            last = t;
            const fin = step(dt, t);
            apply(x);
            if (token !== me) return;
            if (fin) { token = null; raf = 0; if (done) done(); return; }
            raf = requestAnimationFrame(frame);
          };
          raf = requestAnimationFrame(frame);
        };
        const tween = (to, ms, ease, done) => {
          const from = x;
          const t0 = performance.now();
          vel = 0;
          run((dt, t) => {
            const p = clamp((t - t0) / ms, 0, 1);
            x = from + (to - from) * ease(p);
            return p >= 1;
          }, done);
        };
        const val = {
          get: () => x,
          stop,
          set(n) { stop(); x = n; vel = 0; apply(x); return val; },
          timing(to, ms, ease, done) {
            if (k.reduced || !ms) { val.set(to); if (done) done(); return val; }
            tween(to, ms, ease || EASE.out, done);
            return val;
          },
          /** 150ms linear even with reduced motion: for opacity-only changes. */
          fade(to, done) { tween(to, 150, EASE.linear, done); return val; },
          spring(to, cfg, done) {
            if (k.reduced) { val.set(to); if (done) done(); return val; }
            const c = cfg || {};
            const ks = c.stiffness || 180;
            const d = c.damping || 14;
            const m = c.mass || 1;
            run((dt) => {
              const n = 8;
              const h = dt / n;
              for (let i = 0; i < n; i += 1) {
                const acc = (-ks * (x - to) - d * vel) / m;
                vel += acc * h;
                x += vel * h;
              }
              if (Math.abs(x - to) < 0.002 && Math.abs(vel) < 0.02) { x = to; vel = 0; return true; }
              return false;
            }, done);
            return val;
          },
        };
        values.add(val);
        apply(x);
        return val;
      },
      /** Shows which haptic the app fires here; vibrates too where the browser allows it. */
      haptic(kind, ev) {
        let pill = stage.querySelector('.m-buttons-haptic');
        if (!pill) {
          pill = document.createElement('span');
          pill.className = 'm-buttons-haptic';
          pill.setAttribute('aria-hidden', 'true');
          stage.appendChild(pill);
        }
        pill.textContent = 'titrəmə: ' + kind;
        pill.classList.remove('is-on');
        void pill.offsetWidth;
        pill.classList.add('is-on');
        k.clear(pill._hide);
        pill._hide = k.later(() => pill.classList.remove('is-on'), 750);
        const real = ev === true || (ev && ev.isTrusted);
        if (real && navigator.vibrate) { try { navigator.vibrate(VIBRATE[kind] || 8); } catch (e) { /* unsupported */ } }
      },
      /** Pointer + keyboard press tracking like Pressable: down, up(inside), tap. */
      pressable(el, h) {
        let on = false;
        const off = () => el.disabled || el.dataset.lock === '1';
        const down = (ev) => { if (on || off()) return; on = true; if (h.down) h.down(ev); };
        const up = (ev, inside) => { if (!on) return; on = false; if (h.up) h.up(ev, inside); };
        k.on(el, 'pointerdown', (ev) => { if (ev.button === 0) down(ev); });
        k.on(el, 'pointerup', (ev) => up(ev, true));
        k.on(el, 'pointerleave', (ev) => up(ev, false));
        k.on(el, 'pointercancel', (ev) => up(ev, false));
        k.on(el, 'keydown', (ev) => { if ((ev.key === ' ' || ev.key === 'Enter') && !ev.repeat) down(ev); });
        k.on(el, 'keyup', (ev) => { if (ev.key === ' ' || ev.key === 'Enter') up(ev, true); });
        k.on(el, 'blur', (ev) => up(ev, false));
        if (h.tap) k.on(el, 'click', (ev) => { if (!off()) h.tap(ev); });
      },
      cleanup() {
        k.stopDemo();
        timers.forEach((id) => clearTimeout(id));
        timers.clear();
        values.forEach((v) => v.stop());
        offs.splice(0).forEach((fn) => fn());
      },
    };
    k.on(stage, 'pointerdown', () => k.stopDemo(), true);
    k.on(stage, 'keydown', () => k.stopDemo(), true);
    return k;
  }

  /** Face that sinks onto its edge: progress 1 = pressed (translateY depth). */
  function sinker(k, face, o) {
    const depth = o.depth || 4;
    const p = k.value((x) => {
      face.style.transform = 'translateY(' + f2(depth * x) + 'px)' + (o.extra ? ' ' + o.extra(x) : '');
    }, o.init || 0);
    return {
      p,
      down() { p.timing(1, o.inMs || 80, o.inEase || EASE.quadOut); },
      up() {
        if (o.outMs) p.timing(0, o.outMs, o.outEase || EASE.linear);
        else p.spring(0, o.spring || PRESS_SPRING);
      },
    };
  }

  const samples = {};

  // 1. Primary honey button
  const PRIMARY = {
    A: { inMs: 80, spring: PRESS_SPRING },
    B: { inMs: 120, inEase: EASE.linear, outMs: 120, outEase: EASE.linear },
    C: { inMs: 90, spring: { damping: 9, stiffness: 260 }, extra: (x) => 'scale(' + f3(1 + 0.03 * x) + ',' + f3(1 - 0.06 * x) + ')' },
  };
  samples['buttons.primary'] = (stage, variant, k) => {
    const s = sinker(k, k.q('.m-buttons-face'), PRIMARY[variant] || PRIMARY.A);
    const down = (ev) => { k.haptic('Light', ev); s.down(); };
    k.pressable(k.q('.m-buttons-raised'), { down, up: s.up });
    k.demoPress(down, s.up);
  };

  // 2. Spot "Davam et" card
  samples['buttons.spot'] = (stage, variant, k) => {
    const btn = k.q('.m-buttons-spot');
    const face = btn.querySelector('.m-buttons-face');
    const go = btn.querySelector('.m-buttons-go');
    let down;
    let up;
    if (variant === 'B') {
      const s = sinker(k, face, { inMs: 120, spring: { damping: 20, stiffness: 300 } });
      const disc = k.value((x) => { go.style.transform = 'translateX(' + f2(6 * x) + 'px) scale(' + f3(1 + 0.06 * x) + ')'; });
      down = (ev) => { k.haptic('Light', ev); s.down(); disc.timing(1, 120, EASE.quadOut); };
      up = () => { s.up(); disc.spring(0, { damping: 10, stiffness: 240 }); };
    } else if (variant === 'C') {
      const s = sinker(k, face, { depth: 3, inMs: 120, spring: { damping: 14, stiffness: 220 } });
      let rx = 0;
      let ry = 0;
      const tilt = k.value((x) => {
        btn.style.transform = 'perspective(700px) rotateX(' + f2(rx * x) + 'deg) rotateY(' + f2(ry * x) + 'deg)';
      });
      down = (ev) => {
        if (ev && ev.type === 'pointerdown') {
          const r = btn.getBoundingClientRect();
          const nx = clamp(((ev.clientX - r.left) / r.width) * 2 - 1, -1, 1);
          const ny = clamp(((ev.clientY - r.top) / r.height) * 2 - 1, -1, 1);
          ry = nx * 4;
          rx = -ny * 4;
        } else { rx = -2; ry = 2.5; }
        k.haptic('Light', ev);
        s.down();
        tilt.timing(1, 120, EASE.quadOut);
      };
      up = () => { s.up(); tilt.spring(0, { damping: 14, stiffness: 220 }); };
    } else {
      const s = sinker(k, face, { inMs: 120, spring: { damping: 20, stiffness: 300 } });
      down = (ev) => { k.haptic('Light', ev); s.down(); };
      up = s.up;
    }
    k.pressable(btn, { down, up });
    k.demoPress(down, up, 650, 220);
  };

  // 3. Flat controls: secondary, text, icon
  samples['buttons.flat'] = (stage, variant, k) => {
    const handles = k.qa('.m-buttons-icon, .m-buttons-flat').map((el) => {
      const isIcon = el.classList.contains('m-buttons-icon');
      const ico = el.querySelector('.m-buttons-ico');
      const bg = el.querySelector('.m-buttons-bg');
      let h;
      if (variant === 'A') {
        const o = k.value((x) => { el.style.opacity = f3(1 - 0.45 * x); });
        h = { down: () => o.timing(1, 80, EASE.quadOut), up: () => o.timing(0, 180, EASE.quadOut) };
      } else if (variant === 'B') {
        const b = k.value((x) => { bg.style.opacity = f3(x); bg.style.transform = 'scale(' + f3(0.92 + 0.08 * x) + ')'; });
        h = { down: () => b.timing(1, 120, EASE.quadOut), up: () => b.timing(0, 220, EASE.quadOut) };
      } else {
        const min = isIcon ? 0.88 : 0.96;
        const dir = el.dataset.dir;
        const sc = k.value((x) => {
          el.style.transform = 'scale(' + f3(1 - (1 - min) * x) + ')';
          if (ico && dir === 'back') ico.style.transform = 'translateX(' + f2(-3 * x) + 'px)';
          if (ico && dir === 'close') ico.style.transform = 'rotate(' + f2(90 * x) + 'deg)';
        });
        h = { down: () => sc.timing(1, 100, EASE.quadOut), up: () => sc.spring(0, { damping: 12, stiffness: 300 }) };
      }
      k.pressable(el, h);
      return h;
    });
    if (handles[0]) k.demoPress(handles[0].down, handles[0].up, 600, 180);
    if (handles[2]) k.demoPress(handles[2].down, handles[2].up, 1150, 180);
  };

  // 4. YOXLA becomes active once an answer is chosen
  samples['buttons.enable'] = (stage, variant, k) => {
    const opts = k.qa('.m-buttons-opt');
    const btn = k.q('.m-buttons-check');
    const face = btn.querySelector('.m-buttons-face');
    const fill = btn.querySelector('.m-buttons-fill');
    const hint = k.q('.m-buttons-hint');
    const HINT0 = hint.textContent;
    // rise: 1 = lying flat (disabled, no edge), 0 = standing on its edge; the press reuses it.
    const rise = k.value((x) => { face.style.transform = 'translateY(' + f2(4 * x) + 'px)'; }, 1);
    const pour = k.value((x) => { fill.style.transform = 'scaleX(' + f3(clamp(x, 0, 1)) + ')'; }, 0);
    let enabled = false;
    let busy = false;
    const setOff = (off) => {
      btn.disabled = off;
      btn.setAttribute('aria-disabled', String(off));
      btn.classList.toggle('is-off', off);
    };
    setOff(true);
    if (variant !== 'C') fill.style.display = 'none';
    const enable = () => {
      if (enabled) return;
      enabled = true;
      if (variant === 'C') {
        btn.disabled = false;
        btn.setAttribute('aria-disabled', 'false');
        k.later(() => { if (enabled) btn.classList.add('is-lit'); }, k.reduced ? 0 : 200);
        pour.timing(1, 400, EASE.out, () => {
          if (!enabled) return;
          btn.classList.remove('is-off');
          rise.timing(0, 120, EASE.quadOut);
        });
      } else if (variant === 'B') {
        setOff(false);
        k.later(() => { if (enabled) rise.spring(0, { damping: 10, stiffness: 240 }); }, k.reduced ? 0 : 60);
      } else {
        setOff(false);
        rise.timing(0, 220, EASE.out);
      }
    };
    const reset = () => {
      enabled = false;
      busy = false;
      opts.forEach((o) => o.setAttribute('aria-checked', 'false'));
      setOff(true);
      btn.classList.remove('is-lit');
      rise.timing(1, 150, EASE.quadOut);
      pour.timing(0, 150, EASE.quadOut);
      hint.textContent = HINT0;
    };
    const choose = (o, ev) => {
      if (busy) return;
      opts.forEach((x) => x.setAttribute('aria-checked', String(x === o)));
      k.haptic('Selection', ev);
      enable();
      hint.textContent = 'İndi YOXLA düyməsinə toxun';
    };
    opts.forEach((o) => k.on(o, 'click', (ev) => choose(o, ev)));
    k.pressable(btn, {
      down: (ev) => { if (!enabled || busy) return; k.haptic('Light', ev); rise.timing(1, 80, EASE.quadOut); },
      up: () => { if (!enabled || busy) return; rise.spring(0, PRESS_SPRING); },
      tap: () => {
        if (!enabled || busy) return;
        busy = true;
        hint.textContent = 'Demo yenidən başlayır…';
        k.later(reset, 900);
      },
    });
    k.demo(900, () => choose(opts[1], null));
  };

  // 5. Busy state: dots / honey fill / hex cells
  samples['buttons.loading'] = (stage, variant, k) => {
    const btn = k.q('.m-buttons-send');
    const face = btn.querySelector('.m-buttons-face');
    const fill = btn.querySelector('.m-buttons-loadfill');
    const s = sinker(k, face, { inMs: 80, spring: PRESS_SPRING });
    const prog = k.value((x) => { fill.style.transform = 'scaleX(' + f3(clamp(x, 0, 1)) + ')'; }, 0);
    let state = 'idle';
    let realTap = false;
    const set = (st) => {
      state = st;
      btn.classList.toggle('is-busy', st === 'busy');
      btn.classList.toggle('is-done', st === 'done');
      btn.setAttribute('aria-busy', String(st === 'busy'));
      btn.setAttribute('aria-label', st === 'busy' ? 'Göndərilir' : st === 'done' ? 'Göndərildi' : 'Sualı göndər');
      btn.dataset.lock = st === 'idle' ? '' : '1';
    };
    set('idle');
    const finish = () => {
      set('done');
      k.haptic('Success', realTap);
      k.later(() => {
        set('idle');
        if (variant === 'B') {
          fill.style.opacity = '0';
          k.later(() => { prog.set(0); fill.style.opacity = ''; }, 240);
        }
      }, 1100);
    };
    const run = () => {
      set('busy');
      if (variant === 'B') prog.timing(0.85, 1700, EASE.out);
      k.later(() => {
        if (variant === 'B') prog.timing(1, 200, EASE.quadOut, finish);
        else finish();
      }, 1800);
    };
    const down = (ev) => { if (state !== 'idle') return; realTap = !!(ev && ev.isTrusted); k.haptic('Light', ev); s.down(); };
    const up = () => s.up();
    k.pressable(btn, { down, up, tap: () => { if (state === 'idle') run(); } });
    k.demo(650, () => down(null));
    k.demo(820, () => { up(); run(); });
  };

  // 6. Student tab bar with the raised centre "Soruş"
  const TABS = [
    ['Bu gün', '12 uçuş günü · gündəlik hədəf 20 dəq'],
    ['Öyrən', 'Riyaziyyat 7 · 4.3 · Cəmin və fərqin kubu'],
    ['Soruş', 'Şəkil çək və ya Vızıdan soruş'],
    ['İmtahan', 'Buraxılış (9-cu sinif) · İmtahana 142 gün'],
    ['Mən', 'BalArısı_27 · İşçi arı'],
  ];
  samples['buttons.tabbar'] = (stage, variant, k) => {
    const nav = k.q('.m-buttons-tabbar');
    const items = k.qa('[data-tab]');
    const screen = k.q('.m-buttons-tabscreen');
    const title = k.q('.m-buttons-tabtitle');
    const sub = k.q('.m-buttons-tabsub');
    const shared = k.q('.m-buttons-pill');
    const ASK = 2;
    let cur = 0;
    const posOf = (i) => {
      const ic = items[i].querySelector('.m-buttons-tab-ic');
      const a = nav.getBoundingClientRect();
      const b = ic.getBoundingClientRect();
      return { x: b.left - a.left - nav.clientLeft, y: b.top - a.top - nav.clientTop };
    };
    // A: one shared pill (slide x + visibility)
    let sx = 0;
    let sy = 0;
    let sv = 1;
    const render = () => {
      if (!shared) return;
      shared.style.transform = 'translate(' + f2(sx) + 'px,' + f2(sy) + 'px) scale(' + f3(0.6 + 0.4 * sv) + ')';
      shared.style.opacity = f3(clamp(sv, 0, 1));
    };
    const slide = k.value((x) => { sx = x; render(); });
    const vis = k.value((x) => { sv = x; render(); }, 1);
    const place = () => { if (!shared || cur === ASK) return; const p = posOf(cur); sy = p.y; slide.set(p.x); };
    place();
    k.observe(nav, place);
    // B and C: a pill per tab, C also hops the icon
    const pillV = items.map((it, i) => {
      const el = it.querySelector('.m-buttons-tab-pill');
      if (!el || variant === 'A') return null;
      return k.value((x) => {
        el.style.opacity = f3(clamp(variant === 'B' ? x * 1.6 : x, 0, 1));
        el.style.transform = variant === 'B' ? 'scale(' + f3(0.2 + 0.8 * x) + ',' + f3(0.6 + 0.4 * x) + ')' : 'none';
      }, i === 0 ? 1 : 0);
    });
    const hopV = items.map((it) => {
      const ic = it.querySelector('.m-buttons-tab-ic .m-buttons-ico');
      if (!ic || variant !== 'C') return null;
      return k.value((x) => { ic.style.transform = 'translateY(' + f2(-6 * x) + 'px) scale(' + f3(1 + 0.12 * x) + ')'; });
    });
    const swapTitle = (i) => {
      title.textContent = TABS[i][0];
      sub.textContent = TABS[i][1];
      if (!screen.animate) return;
      if (k.reduced) screen.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 150 });
      else screen.animate([{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }], { duration: 220, easing: 'cubic-bezier(.2,.8,.2,1)' });
    };
    const select = (i, ev) => {
      if (i === cur) return;
      const prev = cur;
      cur = i;
      items.forEach((it, j) => { if (j === i) it.setAttribute('aria-current', 'page'); else it.removeAttribute('aria-current'); });
      swapTitle(i);
      if (variant === 'A') {
        if (i === ASK) vis.timing(0, 120, EASE.quadOut);
        else {
          const p = posOf(i);
          sy = p.y;
          if (prev === ASK) { slide.set(p.x); vis.spring(1, { damping: 18, stiffness: 260 }); }
          else slide.spring(p.x, { damping: 18, stiffness: 220 });
        }
      } else {
        if (pillV[prev]) pillV[prev].timing(0, 120, EASE.quadOut);
        if (pillV[i]) {
          if (variant === 'B') pillV[i].spring(1, { damping: 14, stiffness: 260 });
          else pillV[i].timing(1, 120, EASE.quadOut);
        }
        const hop = hopV[i];
        if (hop) hop.timing(1, 110, EASE.quadOut, () => hop.spring(0, { damping: 8, stiffness: 300 }));
      }
      if (i !== ASK) k.haptic('Selection', ev);
    };
    items.forEach((it, i) => { if (i !== ASK) k.on(it, 'click', (ev) => select(i, ev)); });
    const ask = items[ASK];
    const askS = sinker(k, ask.querySelector('.m-buttons-face'), { inMs: 80, spring: PRESS_SPRING });
    k.pressable(ask, {
      down: (ev) => { k.haptic('Medium', ev); askS.down(); },
      up: askS.up,
      tap: (ev) => select(ASK, ev),
    });
    k.demo(700, () => select(1, null));
    k.demo(1500, () => select(3, null));
  };

  // 7. Switch
  samples['buttons.switch'] = (stage, variant, k) => {
    const TRAVEL = 20;
    k.qa('.m-buttons-switch').forEach((sw, idx) => {
      const knob = sw.querySelector('.m-buttons-knob');
      const fill = sw.querySelector('.m-buttons-trackfill');
      let on = sw.getAttribute('aria-checked') === 'true';
      const v = k.value((x) => {
        if (variant === 'B') {
          const pos = clamp(x, 0, TRAVEL);
          const over = Math.abs(x - pos);
          const stretch = 1 + 0.25 * Math.sin(Math.PI * (pos / TRAVEL));
          knob.style.transformOrigin = on ? '100% 50%' : '0% 50%';
          knob.style.transform = 'translateX(' + f2(pos) + 'px) scale(' + f3(stretch * (1 - over / 24)) + ',' + f3(1 + over / 48) + ')';
        } else {
          knob.style.transform = 'translateX(' + f2(x) + 'px)';
        }
        if (variant === 'C') {
          fill.style.width = f2(30 + clamp(x, 0, TRAVEL)) + 'px';
          fill.style.opacity = f3(clamp(x / 6, 0, 1));
        }
      }, on ? TRAVEL : 0);
      const toggle = (ev) => {
        on = !on;
        sw.setAttribute('aria-checked', String(on));
        k.haptic('Light', ev);
        const to = on ? TRAVEL : 0;
        if (variant === 'A') v.timing(to, 220, EASE.out);
        else if (variant === 'B') v.spring(to, { damping: 13, stiffness: 260 });
        else v.timing(to, 300, EASE.inOut);
      };
      k.on(sw, 'click', toggle);
      if (idx === 2) k.demo(700, () => toggle(null));
    });
  };

  // 8. Segmented control: Açıq / Tünd / Sistem
  samples['buttons.segment'] = (stage, variant, k) => {
    const seg = k.q('.m-buttons-seg');
    const ind = k.q('.m-buttons-seg-ind');
    const btns = k.qa('.m-buttons-seg-btn');
    let L = 0;
    let R = 0;
    let cur = 0;
    let pend = 0;
    const render = () => {
      ind.style.transform = 'translateX(' + f2(L) + 'px)';
      ind.style.width = f2(Math.max(0, R - L)) + 'px';
    };
    const lv = k.value((x) => { L = x; render(); });
    const rv = k.value((x) => { R = x; render(); });
    const box = (i) => ({ l: btns[i].offsetLeft, r: btns[i].offsetLeft + btns[i].offsetWidth });
    const place = () => { const b = box(cur); lv.set(b.l); rv.set(b.r); };
    place();
    k.observe(seg, place);
    const select = (i, ev) => {
      if (i === cur) return;
      const dir = i > cur ? 1 : -1;
      cur = i;
      btns.forEach((b, j) => b.setAttribute('aria-checked', String(j === i)));
      k.haptic('Selection', ev);
      const b = box(i);
      k.clear(pend);
      if (variant === 'A') {
        lv.spring(b.l, { damping: 18, stiffness: 240 });
        rv.spring(b.r, { damping: 18, stiffness: 240 });
      } else if (variant === 'B') {
        lv.timing(b.l, 220, EASE.out);
        rv.timing(b.r, 220, EASE.out);
      } else {
        const lead = dir > 0 ? rv : lv;
        const trail = dir > 0 ? lv : rv;
        lead.timing(dir > 0 ? b.r : b.l, 180, EASE.out);
        pend = k.later(() => trail.spring(dir > 0 ? b.l : b.r, { damping: 16, stiffness: 200 }), k.reduced ? 0 : 70);
      }
    };
    btns.forEach((b, i) => k.on(b, 'click', (ev) => select(i, ev)));
    k.demo(700, () => select(1, null));
    k.demo(1500, () => select(2, null));
  };

  // 9. Grade picker: hex cells 5-11
  samples['buttons.grade'] = (stage, variant, k) => {
    const hexes = k.qa('.m-buttons-hex');
    const vals = hexes.map((h) => {
      const fill = h.querySelector('.m-buttons-hex-fill');
      return {
        pop: k.value((x) => { h.style.transform = 'scale(' + f3(x) + ')'; }, 1),
        fill: k.value((x) => { fill.style.transform = 'scaleY(' + f3(clamp(x, 0, 1)) + ')'; }, 0),
      };
    });
    let cur = -1;
    const select = (i, ev) => {
      if (i === cur) return;
      const prev = cur;
      cur = i;
      hexes.forEach((h, j) => h.setAttribute('aria-checked', String(j === i)));
      k.haptic('Selection', ev);
      if (variant === 'B') {
        const pop = vals[i].pop;
        pop.timing(1.12, 90, EASE.quadOut, () => pop.spring(1, { damping: 10, stiffness: 300 }));
      } else if (variant === 'C') {
        if (prev >= 0) { hexes[prev].classList.remove('is-lit'); vals[prev].fill.timing(0, 220, EASE.quadOut); }
        vals[i].fill.timing(1, 400, EASE.out);
        k.later(() => { if (cur === i) hexes[i].classList.add('is-lit'); }, k.reduced ? 0 : 200);
      }
    };
    hexes.forEach((h, i) => k.on(h, 'click', (ev) => select(i, ev)));
    k.demo(700, () => select(2, null));
  };

  // 10. Long press: hold to open a hint
  samples['buttons.hold'] = (stage, variant, k) => {
    const btn = k.q('.m-buttons-hold');
    const tip = k.q('.m-buttons-tip');
    const hint = k.q('.m-buttons-hint');
    const HINT0 = hint.textContent;
    const vz = k.q('.m-buttons-tip-vizi');
    if (vz && window.Lab && Lab.vizi) vz.innerHTML = Lab.vizi('izah', 52);
    const ring = k.q('.m-buttons-ring');
    const rect = ring ? ring.querySelector('rect') : null;
    const hf = k.q('.m-buttons-holdfill');
    const HOLD = 500;
    let open = false;
    let fired = false;
    let holding = false;
    let timer = 0;
    const prog = k.value((x) => {
      if (rect) rect.style.strokeDashoffset = f2(100 - 100 * x);
      if (hf) { hf.style.transform = 'scaleY(' + f3(x) + ')'; btn.classList.toggle('is-lit', x > 0.5); }
    }, 0);
    const pop = k.value((x) => { btn.style.transform = 'scale(' + f3(x) + ')'; }, 1);
    const tipV = k.value((x) => {
      tip.style.opacity = f3(clamp(x, 0, 1));
      if (k.reduced || variant === 'C') tip.style.transform = 'none';
      else if (variant === 'A') tip.style.transform = 'translateY(' + f2(8 * (1 - x)) + 'px)';
      else tip.style.transform = 'scaleY(' + f3(0.6 + 0.4 * x) + ')';
    }, 0);
    const sizeRing = () => {
      if (!ring || !rect) return;
      const w = btn.offsetWidth;
      const h = btn.offsetHeight;
      ring.setAttribute('width', String(w));
      ring.setAttribute('height', String(h));
      ring.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
      rect.setAttribute('width', String(Math.max(0, w - 2)));
      rect.setAttribute('height', String(Math.max(0, h - 2)));
    };
    const showTip = () => {
      open = true;
      tip.classList.add('is-open');
      tip.setAttribute('aria-hidden', 'false');
      if (k.reduced) tipV.fade(1);
      else if (variant === 'A') tipV.timing(1, 220, EASE.out);
      else if (variant === 'B') tipV.spring(1, { damping: 16, stiffness: 220 });
      else tipV.timing(1, 150, EASE.linear);
      hint.textContent = 'Bağlamaq üçün yenidən toxun';
    };
    const hideTip = () => {
      open = false;
      tip.setAttribute('aria-hidden', 'true');
      tipV.fade(0, () => { if (!open) tip.classList.remove('is-open'); });
      hint.textContent = HINT0;
    };
    const fire = (ev) => {
      fired = true;
      k.haptic('Medium', ev);
      if (variant === 'A') pop.timing(1.04, 90, EASE.quadOut, () => pop.spring(1, { damping: 10, stiffness: 300 }));
      if (variant === 'C') pop.timing(0.97, 120, EASE.quadOut);
      showTip();
    };
    const down = (ev) => {
      fired = false;
      holding = true;
      if (open) return;
      sizeRing();
      if (variant !== 'C') prog.timing(1, HOLD, EASE.linear);
      timer = k.later(() => { if (holding) fire(ev); }, HOLD);
    };
    const up = (ev, inside) => {
      holding = false;
      k.clear(timer);
      if (variant === 'C') pop.spring(1, { damping: 14, stiffness: 260 });
      if (fired) { prog.timing(0, 220, EASE.quadOut); return; }
      prog.timing(0, 150, EASE.quadOut);
      if (open) { if (inside) hideTip(); return; }
      if (inside) hint.textContent = 'Barmağını yarım saniyə saxla';
    };
    k.pressable(btn, { down, up });
    k.on(btn, 'contextmenu', (ev) => ev.preventDefault());
    k.demo(800, () => down(null));
    k.demo(1500, () => up(null, false));
    k.demo(3600, () => { if (open) hideTip(); });
  };

  function registerAll() {
    Object.keys(samples).forEach((id) => {
      window.Lab.register(id, (stage, variant, opts) => {
        const k = kit(stage, !!(opts && opts.reduced));
        samples[id](stage, variant, k);
        return k.cleanup;
      });
    });
  }

  // This script runs before the lab runtime defines window.Lab, so register once it exists;
  // if the cards were already mounted without us, replay them so the scripts attach.
  let started = false;
  function start() {
    if (started || !window.Lab) return;
    started = true;
    registerAll();
    document.querySelectorAll('#sec-buttons .sample .replay').forEach((b) => b.click());
  }
  if (window.Lab) start();
  else if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start, { once: true });
  else setTimeout(start, 0);
})();
</script>

<script>
// feedback section: answer moments and rewards. GSAP drives multi-step sequences; WAAPI does
// small one-off bumps. Every mount returns a cleanup; reduced motion (or no GSAP) shows the
// end state with a 150ms fade.
// The section is inserted above the shell's runtime script, so window.Lab may not exist yet:
// register on DOMContentLoaded then (this listener is added before the shell's init listener).
(function boot() {
  'use strict';
  const Lab = window.Lab;
  if (!Lab) {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot, { once: true });
    return;
  }
  const DROP = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c3 4.2 6 7.6 6 11a6 6 0 0 1-12 0c0-3.4 3-6.8 6-11z"/></svg>';
  const $ = (root, sel) => root.querySelector(sel);
  const $$ = (root, sel) => Array.from(root.querySelectorAll(sel));
  const fmt = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');

  /** Collects tweens, timers and listeners of one mount so cleanup is one call. */
  function kit() {
    const list = [];
    const timers = [];
    const offs = [];
    const keep = (t) => { if (t) list.push(t); return t; };
    const stop = () => {
      list.splice(0).forEach((t) => { try { if (t.kill) t.kill(); else if (t.cancel) t.cancel(); } catch (e) { /* already finished */ } });
      timers.splice(0).forEach(clearTimeout);
    };
    return {
      keep,
      stop,
      tl: (o) => keep(window.gsap.timeline(o)),
      wait: (ms, fn) => { timers.push(setTimeout(fn, ms)); },
      on: (el, type, fn) => { if (!el) return; el.addEventListener(type, fn); offs.push(() => el.removeEventListener(type, fn)); },
      waapi: (el, frames, o) => (el && el.animate ? keep(el.animate(frames, o)) : null),
      done: () => { stop(); offs.splice(0).forEach((f) => f()); },
    };
  }
  const softIn = (k, el) => k.waapi(el, [{ opacity: 0 }, { opacity: 1 }], { duration: 150, easing: 'ease-out' });
  const bump = (k, el, s) => k.waapi(el, [{ transform: 'scale(1)' }, { transform: 'scale(' + (s || 1.1) + ')' }, { transform: 'scale(1)' }], { duration: 220, easing: 'cubic-bezier(.2,.8,.2,1)' });
  const drawAll = (k, root, ms) => $$(root, '.m-feedback-draw').forEach((p) => k.waapi(p, [{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }], { duration: ms || 300, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'backwards' }));
  /** Draw the icon paths and fade in an element at `pos` of a GSAP timeline. */
  const drawIn = (tl, el, pos, dur) => {
    if (!el) return;
    const paths = $$(el, '.m-feedback-draw');
    if (paths.length) tl.fromTo(paths, { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: dur || 0.3, ease: 'power2.out' }, pos);
  };
  const fadeUp = (tl, els, pos, stagger) => {
    if (!els.length) return;
    tl.fromTo(els, { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.22, ease: 'power2.out', stagger: stagger || 0.12 }, pos);
  };
  /** A count-up tween for the element's data-count / data-pre / data-suf. */
  const countTween = (el, to, dur) => {
    const o = { v: 0 };
    const pre = el.dataset.pre || '';
    const suf = el.dataset.suf || '';
    el.textContent = pre + '0' + suf;
    return window.gsap.to(o, { v: to, duration: dur || 0.9, ease: 'power2.out', onUpdate: () => { el.textContent = pre + fmt(o.v) + suf; } });
  };
  /** Centre of `el` relative to `box`, in px. */
  const centre = (el, box) => {
    const a = el.getBoundingClientRect();
    const b = box.getBoundingClientRect();
    return { x: a.left - b.left + a.width / 2, y: a.top - b.top + a.height / 2 };
  };

  // ------------------------------------------------------------ 1. select
  Lab.register('feedback.select', (stage, v, { reduced }) => {
    const k = kit();
    const opts = $$(stage, '.m-feedback-opt');
    const go = $(stage, '.m-feedback-go');
    const live = $(stage, '.m-feedback-live');
    let picked = null;
    let checked = false;
    const reset = () => {
      checked = false;
      picked = null;
      opts.forEach((o) => { o.dataset.state = 'idle'; o.setAttribute('aria-checked', 'false'); o.removeAttribute('aria-disabled'); });
      go.setAttribute('aria-disabled', 'true');
      go.textContent = 'YOXLA';
      live.textContent = '';
    };
    opts.forEach((o) => k.on(o, 'click', () => {
      if (checked) return;
      picked = o;
      opts.forEach((x) => { x.dataset.state = x === o ? 'sel' : 'idle'; x.setAttribute('aria-checked', String(x === o)); });
      go.setAttribute('aria-disabled', 'false');
    }));
    k.on(go, 'click', () => {
      if (checked) { reset(); return; }
      if (!picked) return;
      checked = true;
      opts.forEach((x) => {
        x.setAttribute('aria-disabled', 'true');
        x.dataset.state = x.dataset.l === 'B' ? 'ok' : x === picked ? 'bad' : 'dim';
      });
      if (!reduced) drawAll(k, stage, 300);
      live.textContent = picked.dataset.l === 'B' ? 'Düzdür! +15 bal.' : 'Bu dəfə alınmadı. Düzgün cavab: B.';
      go.textContent = 'YENİDƏN SEÇ';
    });
    reset();
    return k.done;
  });

  // ------------------------------------------------------------ 2–3. correct / wrong reveal
  function reveal(stage, v, reduced, wrong) {
    const k = kit();
    const G = window.gsap;
    const opts = $$(stage, '.m-feedback-opt');
    const right = opts.find((o) => o.dataset.l === 'B');
    const mine = opts.find((o) => o.dataset.l === (wrong ? 'D' : 'B'));
    const check = $(stage, '.m-feedback-check');
    const sheet = $(stage, '.m-feedback-sheet');
    const next = $(stage, '.m-feedback-next');
    const live = $(stage, '.m-feedback-live');
    const guide = $(stage, '.m-feedback-guide');
    const peek = $(stage, '.m-feedback-peek');
    const badge = $(sheet, '.m-feedback-badge');
    const pill = $(sheet, '.m-feedback-pill');
    if (peek) peek.innerHTML = Lab.vizi('teselli', 64);
    let tl = null;
    const vOf = (o) => $(o, o === right ? '.m-feedback-verdict--ok' : '.m-feedback-verdict--bad');
    const lock = () => opts.forEach((o) => { o.setAttribute('aria-disabled', 'true'); if (o !== right && o !== mine) o.dataset.state = 'dim'; });
    const open = () => {
      sheet.removeAttribute('inert');
      sheet.removeAttribute('aria-hidden');
      live.textContent = wrong ? 'Bu dəfə alınmadı. Düzgün cavab: B.' : 'Düzdür! +15 bal.';
    };
    const start = () => {
      if (tl) tl.kill();
      opts.forEach((o) => {
        o.removeAttribute('aria-disabled');
        o.dataset.state = o === mine ? 'sel' : 'idle';
        o.setAttribute('aria-checked', String(o === mine));
      });
      sheet.setAttribute('inert', '');
      sheet.setAttribute('aria-hidden', 'true');
      check.classList.remove('is-pressed');
      live.textContent = '';
    };
    const play = () => {
      start();
      if (reduced || !G) {
        lock();
        mine.dataset.state = wrong ? 'bad' : 'ok';
        right.dataset.state = 'ok';
        sheet.style.transform = 'none';
        open();
        softIn(k, sheet);
        return;
      }
      G.set(opts, { clearProps: 'transform' });
      G.set(sheet, { y: 0, yPercent: 110 });
      if (peek) G.set(peek, { y: 30, opacity: 0, rotation: 0 });
      if (guide) G.set(guide, { opacity: 0 });
      tl = k.tl({ delay: 0.6 });
      tl.add(() => check.classList.add('is-pressed'), 0)
        .add(() => check.classList.remove('is-pressed'), 0.14)
        .addLabel('mark', 0.22)
        .add(() => { lock(); mine.dataset.state = wrong ? 'bad' : 'ok'; }, 'mark');
      drawIn(tl, vOf(mine), 'mark+=0.03');
      tl.fromTo(vOf(mine), { opacity: 0, x: -4 }, { opacity: 1, x: 0, duration: 0.22, ease: 'power2.out' }, 'mark+=0.03');
      let sheetAt = 0.45;
      if (wrong) {
        let rightAt = 0.35;
        if (v === 'B' && guide) {
          const g0 = mine.offsetTop - 5;
          const g1 = right.offsetTop - 5;
          tl.set(guide, { y: g0, height: mine.offsetHeight + 10 }, 'mark+=0.3')
            .to(guide, { opacity: 1, duration: 0.15 }, 'mark+=0.3')
            .to(guide, { y: g1, duration: 0.45, ease: 'power2.inOut' }, 'mark+=0.5')
            .to(guide, { opacity: 0, duration: 0.3 }, 'mark+=1.1');
          rightAt = 0.95;
        }
        tl.add(() => { right.dataset.state = 'ok'; }, 'mark+=' + rightAt);
        drawIn(tl, vOf(right), 'mark+=' + (rightAt + 0.03));
        tl.fromTo(vOf(right), { opacity: 0, x: -4 }, { opacity: 1, x: 0, duration: 0.22, ease: 'power2.out' }, 'mark+=' + (rightAt + 0.03));
        sheetAt = rightAt + 0.45;
      } else if (v === 'B') {

        tl.fromTo($(right, '.m-feedback-ripple'), { opacity: 0.7, scale: 1 }, { opacity: 0, scale: 1.07, duration: 0.6, ease: 'power2.out' }, 'mark+=0.1');

          .to(peek, { rotation: -6, duration: 0.2, yoyo: true, repeat: 1, ease: 'sine.inOut' }, 'sheet+=0.75');

  Lab.register('feedback.correct', (stage, v, { reduced }) => reveal(stage, v, reduced, false));
  Lab.register('feedback.wrong', (stage, v, { reduced }) => reveal(stage, v, reduced, true));

  // ------------------------------------------------------------ 4. points
  Lab.register('feedback.points', (stage, v, { reduced }) => {
    const k = kit();
    const G = window.gsap;
    const box = $(stage, '.m-feedback-pts');
    const from = $(stage, '.m-feedback-opt');
    const pill = $(stage, '.m-feedback-counter');
    const icon = $(stage, '.m-feedback-cicon');
    const num = $(stage, '.m-feedback-cnum');
    const fill = $(stage, '.m-feedback-cfill > i');
    const chip = $(stage, '.m-feedback-chipout');
    const again = $(stage, '[data-role="again"]');
    const live = $(stage, '.m-feedback-live');
    const cnt = { v: 1240 };
    let target = 1240;
    let promised = 1240;
    let level = 0;
    num.textContent = fmt(cnt.v);
    const add = (n) => {
      target += n;
      if (reduced || !G) { cnt.v = target; num.textContent = fmt(target); return; }
      k.keep(G.to(cnt, { v: target, duration: 0.3, ease: 'power2.out', overwrite: true, onUpdate: () => { num.textContent = fmt(cnt.v); } }));
      bump(k, pill, 1.1);
    };
    /** Moves `el` along a quadratic curve from the answer to the counter icon. */
    const fly = (el, delay, dur, bend, onArrive) => {
      box.appendChild(el);
      const w = el.offsetWidth;
      const h = el.offsetHeight;
      const s = centre(from, box);
      const e = centre(icon, box);
      const c = { x: s.x + bend, y: e.y };
      const o = { t: 0 };
      const place = () => {
        const t = o.t;
        const u = 1 - t;
        const x = u * u * s.x + 2 * u * t * c.x + t * t * e.x;
        const y = u * u * s.y + 2 * u * t * c.y + t * t * e.y;
        el.style.transform = 'translate(' + (x - w / 2).toFixed(1) + 'px,' + (y - h / 2).toFixed(1) + 'px) scale(' + (1 - 0.45 * t).toFixed(3) + ')';
        el.style.opacity = t > 0.85 ? ((1 - t) / 0.15).toFixed(2) : '1';
      };
      k.keep(G.to(o, { t: 1, duration: dur, delay, ease: 'power1.inOut', onStart: place, onUpdate: place, onComplete: () => { el.remove(); onArrive(); } }));
    };
    const floatLabel = () => {
      const f = document.createElement('span');
      f.className = 'm-feedback-float';
      f.textContent = '+15 bal';
      box.appendChild(f);
      const s = centre(from, box);
      f.style.left = (s.x - f.offsetWidth / 2).toFixed(1) + 'px';
      f.style.top = (s.y - 40).toFixed(1) + 'px';
      const a = k.waapi(f, [{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'translateY(0)', offset: 0.3 }, { opacity: 0, transform: 'translateY(-24px)' }], { duration: 700, easing: 'ease-out', fill: 'forwards' });
      if (a) a.onfinish = () => f.remove();
    };
    const drop = (cls) => { const d = document.createElement('span'); d.className = cls || 'm-feedback-fly'; d.innerHTML = DROP; return d; };
    const fire = () => {
      promised += 15;
      live.textContent = '+15 bal. Cəmi: ' + fmt(promised) + ' bal.';
      if (reduced || !G) { add(15); softIn(k, num); return; }
      if (v === 'A') {
        const t = drop('m-feedback-token');
        t.insertAdjacentHTML('beforeend', '+15');
        fly(t, 0, 0.7, -10, () => add(15));
      } else if (v === 'B') {
        floatLabel();
        [-28, 18, -8, 30, 6].forEach((bend, i) => fly(drop(), i * 0.08, 0.65, bend, () => add(3)));
      } else {
        const steps = [2, 2, 2, 2, 2, 2, 2, 1];
        steps.forEach((n, i) => {
          const d = drop();
          d.style.width = '12px';
          d.style.height = '12px';
          fly(d, i * 0.05, 0.55, (i % 2 ? 14 : -14) - i, () => {
            add(n);
            level = Math.min(1, level + 1 / steps.length);
            k.keep(G.to(fill, { yPercent: 100 - level * 100, duration: 0.15, ease: 'power1.out' }));
            if (i === steps.length - 1) {
              level = 0;
              k.keep(G.to(fill, { yPercent: 100, duration: 0.4, delay: 0.35, ease: 'power2.in' }));
              if (chip) {
                const p = centre(pill, box);
                chip.style.left = (p.x - chip.offsetWidth / 2).toFixed(1) + 'px';
                chip.style.top = (p.y + 10).toFixed(1) + 'px';
                G.set(chip, { opacity: 0, y: 0 });
                k.keep(G.to(chip, { keyframes: [{ opacity: 1, y: 8, duration: 0.25 }, { opacity: 0, y: 18, duration: 0.45, delay: 0.25 }], delay: 0.3 }));
              }
            }
          });
        });
      }
    };
    if (G) G.set(fill, { y: 0, yPercent: 100 });
    k.on(again, 'click', fire);
    k.wait(reduced ? 0 : 450, fire);
    return k.done;
  });

    const k = kit();
    const G = window.gsap;
    const bar = $(stage, '[role="progressbar"]');

    const setFill = () => { if (fill) fill.style.transform = 'translateX(' + fx.x.toFixed(2) + '%)'; };
    const paint = () => {
      bar.setAttribute('aria-valuenow', String(n));
      bar.setAttribute('aria-label', 'Sual ' + n + ' / 10');
      count.textContent = n + '/10';
      label.textContent = n >= 10 ? 'Toxun: yenidən başla' : 'Toxun: növbəti sual';
      live.textContent = n >= 10 ? 'Test bitdi: 10 / 10.' : 'Sual ' + n + ' / 10.';
      if (!reduced) k.waapi(count, [{ transform: 'translateY(6px)', opacity: 0 }, { transform: 'none', opacity: 1 }], { duration: 220, easing: 'cubic-bezier(.2,.8,.2,1)' });
      if (cells.length) {
        cells.forEach((c, i) => { c.classList.toggle('is-done', i < n); c.classList.toggle('is-cur', i === n); });
        return;
      }
      const x = (n / 10 - 1) * 100;
      if (v === 'B' && G && !reduced && n > 1) {
        k.keep(G.to(fx, { x, duration: 0.6, ease: 'back.out(1.6)', overwrite: true, onUpdate: setFill }));
        const end = bar.clientWidth * (n / 10);
        G.set(shine, { x: -34, opacity: 0 });
        k.keep(G.to(shine, { keyframes: [{ opacity: 1, duration: 0.1 }, { x: end - 20, duration: 0.6, ease: 'power1.inOut' }, { opacity: 0, duration: 0.15 }], delay: 0.45 }));
      } else if (v === 'B' && G && !reduced) {
        k.keep(G.to(fx, { x, duration: 0.3, ease: 'power2.inOut', overwrite: true, onUpdate: setFill }));
      } else {
        fx.x = x;
        setFill();
      }
    };
    const advance = () => { n = n >= 10 ? 1 : n + 1; paint(); };
    k.on(step, 'click', advance);
    k.wait(reduced ? 0 : 500, advance);
    return k.done;
  });

  Lab.register('feedback.streak', (stage, v, { reduced }) => {

    const tl = k.tl({ delay: 0.5, onComplete: say });
    const roll = (pos, springy) => {
      tl.to(old, { yPercent: -100, opacity: 0, duration: 0.22, ease: 'power2.in' }, pos)
        .to(nw, { yPercent: 0, opacity: 1, duration: springy ? 0.45 : 0.26, ease: springy ? 'back.out(2.2)' : 'power2.out' }, pos + 0.08);
    };
    if (v === 'A') {
      tl.to(tfill, { yPercent: 0, duration: 0.4, ease: 'power2.out' }, 0);
      roll(0.3);
    } else if (v === 'B') {
      tl.to(wing, { y: -6, rotation: -14, duration: 0.18, ease: 'power2.out' }, 0)
        .to(wing, { rotation: 10, duration: 0.1, repeat: 3, yoyo: true, ease: 'sine.inOut' }, 0.18)
        .to(wing, { y: 0, rotation: 0, duration: 0.45, ease: 'back.out(3)' }, 0.58)
        .to(tfill, { yPercent: 0, duration: 0.4, ease: 'power2.out' }, 0.5)
        .fromTo(ring, { scale: 1, opacity: 0.5 }, { scale: 1.6, opacity: 0, duration: 0.7, ease: 'power2.out' }, 0.85);
      roll(0.8, true);
      tl.fromTo(odo, { scale: 1 }, { scale: 1.12, duration: 0.15, yoyo: true, repeat: 1, ease: 'power1.out' }, 0.95);
    } else {
      const w = card.clientWidth;
      const h = card.clientHeight;
      const hx = centre(today, card);
      const S = { x: -70, y: h * 0.55 };
      const E = { x: w - 38, y: 34 };
      const H = { x: hx.x, y: hx.y - 44 };
      const C = { x: (4 * H.x - S.x - E.x) / 2, y: (4 * H.y - S.y - E.y) / 2 };
      const o = { t: 0, b: 0 };
      const place = () => {
        const t = o.t;
        const u = 1 - t;
        const x = u * u * S.x + 2 * u * t * C.x + t * t * E.x - 28;
        const y = u * u * S.y + 2 * u * t * C.y + t * t * E.y - 28 + o.b;
        flyer.style.transform = 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px) rotate(' + (-8 + 14 * t).toFixed(1) + 'deg)';
      };
      place();
      tl.to(o, { t: 1, duration: 1.2, ease: 'power1.inOut', onUpdate: place }, 0)
        .to(tfill, { yPercent: 0, duration: 0.4, ease: 'power2.out' }, 0.55)
        .to(o, { b: -6, duration: 0.3, yoyo: true, repeat: 1, ease: 'sine.inOut', onUpdate: place }, 1.25);

  Lab.register('feedback.goal', (stage, v, { reduced }) => {

    const tl = k.tl({ delay: 0.5, onComplete: say });

      fadeUp(tl, [cta], 1.3);
    } else if (v === 'B') {
      title.innerHTML = title.textContent.split(' ').map((w) => '<span class="m-feedback-w">' + w + '</span>').join(' ');
      const words = $$(title, '.m-feedback-w');
      G.set([kicker, text, cta, ...words], { opacity: 0 });
      G.set(outline, { strokeDashoffset: 1 });
      G.set(fill, { y: 0, yPercent: 100 });
      G.set(inner, { scale: 0 });
      fadeUp(tl, [kicker], 0);
      tl.to(outline, { strokeDashoffset: 0, duration: 0.45, ease: 'power1.inOut' }, 0.1)
        .to(fill, { yPercent: 0, duration: 0.4, ease: 'power2.out' }, 0.5)
        .to(inner, { scale: 1, duration: 0.35, ease: 'back.out(2.2)' }, 0.85)
        .fromTo(pulse, { opacity: 0.6, scale: 1 }, { opacity: 0, scale: 1.35, duration: 0.7, ease: 'power2.out' }, 0.85);
      fadeUp(tl, words, 1.0, 0.08);
      fadeUp(tl, [text], 1.25);
      climb(1.4);
      fadeUp(tl, [cta], 1.7);
    } else {
      const hex3 = $(steps[2], '.m-feedback-step-hex');
      G.set([kicker, title, text, cta, badge], { opacity: 0 });
      hex3.style.transition = 'none';
      G.set(hex3, { transformPerspective: 300 });
      tl.to(mark, { x: cx(2), duration: 0.4, ease: 'power2.inOut' }, 0.3)
        .to(hex3, { rotationY: 90, duration: 0.16, ease: 'power2.in' }, 0.75)
        .add(() => ladder(true), 0.91)
        .fromTo(hex3, { rotationY: -90 }, { rotationY: 0, duration: 0.22, ease: 'power2.out' }, 0.91)
        .add(() => { G.set(hex3, { clearProps: 'transform' }); hex3.style.transition = ''; }, 1.14)
        .add(() => {
          const a = hex3.getBoundingClientRect();
          const b = badge.getBoundingClientRect();
          const dx = a.left + a.width / 2 - (b.left + b.width / 2);
          const dy = a.top + a.height / 2 - (b.top + b.height / 2);
          k.keep(G.fromTo(badge, { x: dx, y: dy, scale: 0.35, opacity: 0 }, { x: 0, y: 0, scale: 1, opacity: 1, duration: 0.55, ease: 'power3.out' }));
        }, 1.2);
      fadeUp(tl, [kicker, title, text], 1.6, 0.1);
      fadeUp(tl, [cta], 2.0);
    }
    return k.done;
  });

  // ------------------------------------------------------------ 10. score ring
  Lab.register('feedback.score', (stage, v, { reduced }) => {
    const k = kit();
    const G = window.gsap;
    const fg = $(stage, '.m-feedback-sc-fg');
    const segs = $$(stage, '.m-feedback-seg');
    const hexes = $$(stage, '.m-feedback-sh');
    const mid = $(stage, '.m-feedback-sc-mid');
    const nEl = $(stage, '.m-feedback-sc-n');
    const pEl = $(stage, '.m-feedback-sc-p');
    const outs = $$(stage, '[data-in]');
    const live = $(stage, '.m-feedback-live');
    const say = () => { live.textContent = 'Nəticə: 10 sualdan 8-i düz, 80%. +80 bal.'; };
    if (reduced || !G) { softIn(k, mid); say(); return k.done; }
    const set = (n) => { nEl.textContent = String(n); pEl.textContent = String(n * 10); };
    set(0);
    G.set(outs, { opacity: 0 });
    const tl = k.tl({ delay: 0.4, onComplete: say });
    let end = 1;
    if (v === 'A') {
      const p = { v: 0 };
      fg.style.strokeDashoffset = '100';
      tl.to(p, { v: 0.8, duration: 0.9, ease: 'power2.out', onUpdate: () => {
        fg.style.strokeDashoffset = (100 - p.v * 100).toFixed(2);
        nEl.textContent = String(Math.round(p.v * 10));
        pEl.textContent = String(Math.round(p.v * 100));
      } }, 0);
    } else {
      const items = v === 'B' ? segs : hexes;
      let c = 0;
      items.forEach((el, i) => {
        const ok = !el.classList.contains('m-feedback-sh--rep') && !el.classList.contains('m-feedback-seg--rep');
        const at = i * 0.09;
        if (v === 'B') {
          G.set(el, { attr: { 'stroke-dasharray': '0 100' } });
          tl.to(el, { attr: { 'stroke-dasharray': '8.6 91.4' }, duration: 0.16, ease: 'power1.out' }, at);
        } else {
          const cellFill = $(el, 'i');
          G.set(cellFill, { scale: 0 });
          tl.to(cellFill, { scale: 1, duration: 0.25, ease: 'back.out(2.2)' }, at);
        }
        if (ok) tl.add(() => { c += 1; set(c); }, at + 0.12);
      });
      end = items.length * 0.09 + 0.2;
      tl.fromTo(mid, { scale: 0.85 }, { scale: 1, duration: 0.35, ease: 'back.out(2.2)' }, end);
    }
    fadeUp(tl, outs, end + 0.1);
    return k.done;
  });
})();
</script>
