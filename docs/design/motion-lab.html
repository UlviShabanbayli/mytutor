    <template data-variant="C" data-label="Hüceyrədən açılır" data-spec="shared element: the tapped hex lifts (scale 1.12 at mid) and flies into the sheet header 380ms cubic-bezier(.2,.8,.2,1) while the sheet rises 340ms · RN: measure() the cell and the sheet slot, animate an absolutely positioned overlay HexCell (translateX/Y + scale withTiming 380) and show the sheet's own cell when it lands (Reanimated shared element transitions are still experimental); Haptics.selectionAsync">
      <div class="m-hive-x m-hive-phone m-hive-tap m-hive-tap-c"></div>
    </template>
  </article>

  <!-- 6. frame (unit) expand / collapse -->
  <article class="sample" data-id="hive.frame-toggle" data-title="Çərçivəni açıb-bağlamaq" data-when="Pətək qutusunda çərçivənin başlığına toxunanda çərçivə açılır və hüceyrələr görünür; ikinci toxunuş bağlayır.">
    <template data-variant="A" data-label="Sıra ilə" data-spec="height 0→auto 320ms cubic-bezier(.2,.8,.2,1) · chevron 180° 220ms · cells fade in, rise 8px and scale .9→1 240ms, 45ms apart in reading order · close: cells fade 120ms, height 260ms · RN: cells entering={FadeInDown.delay(80 + i*45).duration(240)} exiting={FadeOut.duration(120)}; frame body layout={LinearTransition.duration(320)}; chevron rotate withTiming 220; Haptics.selectionAsync on toggle">
      <div class="m-hive-x m-hive-boxcol m-hive-tog m-hive-tog-a"></div>
    </template>
    <template data-variant="B" data-label="Mərkəzdən dalğa" data-spec="height 280ms · cells pop from scale 0 with overshoot (cubic-bezier(.34,1.56,.64,1)) 360ms, delayed by distance from the current cell 4.3, so the comb grows out of “you are here” · RN: entering={ZoomIn.delay(d).springify().damping(13)} with d = distance to the current cell × 1.1ms; layout={LinearTransition}; Haptics.selectionAsync">
      <div class="m-hive-x m-hive-boxcol m-hive-tog m-hive-tog-b"></div>
    </template>
    <template data-variant="C" data-label="Zolaqdan böyüyür" data-spec="each cell grows out of its mini hex in the header strip: translate + scale 460ms cubic-bezier(.2,.8,.2,1), 40ms stagger, height 380ms; closing flies them back into the strip (420ms, reverse order) · RN: measure() strip dots and comb cells (or compute from layout), per cell withDelay(i*40, withTiming) on translateX/translateY/scale; strip opacity withTiming 120; Haptics.selectionAsync">
      <div class="m-hive-x m-hive-boxcol m-hive-tog m-hive-tog-c"></div>
    </template>

  <!-- 7. placement result -->
  <article class="sample" data-id="hive.placement-result" data-title="Yoxlamanın nəticəsi" data-when="“Bilirəm, yoxla” bitəndə nəticə ekranında: bildiyin mövzuların hüceyrələri ardıcıl dolur, sonra başlanğıc hüceyrən yumşaq döyünür.">
    <template data-variant="A" data-label="Bir-bir" data-spec="each known cell fills from the bottom 220ms cubic-bezier(.33,0,.2,1), 65ms apart (17 cells ≈ 1.3s) · the counter ticks with each cell · a row badge turns honey 220ms when its row is done · start card rises 300ms · start cell pulses twice (1200ms) · once · RN: per-cell withDelay(i*65, withTiming(1, {duration: 220})) on scaleY; counter via useAnimatedReaction + runOnJS (or an AnimatedText); Haptics.selectionAsync every 5th cell, notificationAsync(Success) at the end">
      <div class="m-hive-x m-hive-pr m-hive-pr-a"></div>
    </template>
    <template data-variant="B" data-label="Sətir-sətir" data-spec="row by row: rows 260ms apart, cells inside a row 35ms apart, fill 220ms · counter follows · start card and pulse as A · once (≈1.8s) · RN: same as A with row-based delays (r*260 + c*35); Haptics.impactAsync(Light) once per row">
      <div class="m-hive-x m-hive-pr m-hive-pr-b"></div>
    </template>
    <template data-variant="C" data-label="Vızı ilə" data-spec="diagonal wave: cells fade wax→honey 300ms, delay (row + column)·70ms · Vızı (sevinc) pops in 520ms cubic-bezier(.34,1.56,.64,1) as the wave ends · start cell pulses twice · once · RN: same per-cell delays on opacity; Vızı entering={ZoomIn.springify().damping(12)}; Haptics.notificationAsync(Success) with Vızı">
      <div class="m-hive-x m-hive-pr m-hive-pr-c"></div>
    </template>

  <!-- 8. unit sealed celebration -->
  <article class="sample" data-id="hive.unit-sealed" data-title="Çərçivə möhürləndi" data-when="Çərçivənin son hüceyrəsi möhürlənəndə: hüceyrələr dalğa ilə bağlanır, ana arı hüceyrəsi (bölmə sınağı) oyanır və sınaq təklif olunur.">
    <template data-variant="A" data-label="Sakit dalğa" data-spec="honey→sealed and caps close in a wave, 110ms apart: colour 300ms + cap 380ms cubic-bezier(.34,1.56,.64,1) · the queen cell wakes 600ms (ring, soft glow, star turns honey) · CTA rises 320ms · once (≈2.1s) · RN: per cell withDelay(i*110, withSpring({damping: 12, stiffness: 180})) on the cap scale; queen ring opacity + scale withSequence; CTA entering={FadeInUp.delay(1700)}; Haptics.impactAsync(Light) per cap, notificationAsync(Success) for the queen">
      <div class="m-hive-x m-hive-us m-hive-us-a"></div>
    </template>
    <template data-variant="B" data-label="Bayram" data-spec="celebrate ≈2.3s on the honey panel: Vızı (bayram) hops in 700ms cubic-bezier(.34,1.56,.64,1) · caps close with a small bounce per cell (scale 1.1, 110ms apart) · “+15 bal” chip 1000ms · queen glows twice · CTA 320ms · once · RN: as A plus Vızı entering={ZoomIn.springify()}; per cell withSequence(withTiming(1.1, {duration: 160}), withSpring(1)); Haptics.notificationAsync(Success) at the queen">
      <div class="m-hive-x m-hive-us m-hive-us-b"></div>
    </template>
    <template data-variant="C" data-label="İşıq izi" data-spec="a band of light sweeps the frame 1000ms cubic-bezier(.4,0,.2,1); each cell seals the moment the band passes it (cap 220ms) · the queen wakes when the band leaves · once (≈2s) · RN: band = LinearGradient translateX withTiming 1000; each cell reads the band progress in useDerivedValue and closes its cap when progress ≥ its x / width; Haptics.impactAsync(Light) at the queen">
      <div class="m-hive-x m-hive-us m-hive-us-c"></div>

  <!-- 9. current cell attention -->
  <article class="sample" data-id="hive.current-pulse" data-title="Cari hüceyrə" data-when="Pətək qutusunda “Sən buradasan” hüceyrəsi: diqqəti yumşaq çəkir, ekran açılandan sonra 3 dövr oynayır və dayanır (bezdirmir).">

      <div class="m-hive-x m-hive-cp m-hive-cp-b"></div>
    </template>
    <template data-variant="C" data-label="Nektar yırğalanır" data-spec="no ring motion: the nectar surface tilts ±3° around its centre, 3200ms ease-in-out, 3 cycles, then still · RN: rotate the liquid G (origin at the surface centre) inside the hex ClipPath with withRepeat(withSequence(withTiming(-3), withTiming(3), withTiming(0)), 3); no haptic">
      <div class="m-hive-x m-hive-cp m-hive-cp-c"></div>
    </template>
  </article>
</section>
<style>
  /* ---------- shared: the hex cell (pointy-top, as HexCell.tsx) ---------- */
  .m-hive-cell { --w: 72px; --clip: polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%); position: relative; width: var(--w); height: calc(var(--w) * 1.14); flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; margin: 0; padding: 0; border: 0; background: none; font: inherit; color: var(--lock-ink); vertical-align: top; }
  .m-hive-cell.is-q { --clip: polygon(50% 0,100% 19%,100% 81%,50% 100%,0 81%,0 19%); height: calc(var(--w) * 1.45); }
  button.m-hive-cell { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .m-hive-cell > * { pointer-events: none; }
  .m-hive-pulse, .m-hive-ring, .m-hive-body { position: absolute; inset: 0; clip-path: var(--clip); }
  .m-hive-pulse { background: var(--honey); opacity: 0; }
  .m-hive-halo { position: absolute; inset: -22%; border-radius: 50%; background: radial-gradient(closest-side, var(--honey), transparent); opacity: 0; }
  .m-hive-ring { background: var(--honey-deep); opacity: 0; }
  .m-hive-cell.is-ring > .m-hive-ring { opacity: 1; }
  .m-hive-cell.is-ring > .m-hive-body { inset: 4px; }
  .m-hive-body { background: var(--wax); overflow: hidden; }
  .m-hive-liq { position: absolute; left: 0; right: 0; bottom: 0; height: 0; color: var(--nectar); background: currentColor; }
  .m-hive-men { position: absolute; left: 0; bottom: calc(100% - 1px); width: 100%; height: 7px; display: block; overflow: visible; fill: currentColor; opacity: 0; transform-origin: 50% 100%; }
  .m-hive-men .m-hive-hl { fill: none; stroke: var(--cap); stroke-width: 1.4; vector-effect: non-scaling-stroke; opacity: 0.8; }
  .m-hive-wave { position: absolute; left: 0; bottom: calc(100% - 2px); width: 100%; height: 13px; overflow: hidden; display: none; transform-origin: 50% 100%; }
  .m-hive-wave svg { display: block; width: 200%; height: 100%; fill: currentColor; }
  .m-hive-frost { position: absolute; inset: 0; background: var(--crystal); opacity: 0; }
  .m-hive-fac { position: absolute; left: 0; top: 0; width: 100%; height: 100%; fill: none; stroke: var(--surf); stroke-width: 1.5625; stroke-linecap: butt; opacity: 0; }
  .m-hive-fac path, .m-hive-capline path { stroke-dasharray: 1; stroke-dashoffset: 0; }
  .m-hive-cap { position: absolute; left: 12%; right: 12%; top: calc(var(--w) * 0.12); bottom: calc(var(--w) * 0.12); clip-path: var(--clip); background: var(--cap); transform: scale(0); }
  .m-hive-capline { position: absolute; left: 12%; top: calc(var(--w) * 0.12); width: 76%; height: calc(100% - var(--w) * 0.24); overflow: visible; fill: none; stroke: var(--cap); stroke-width: 3.5; stroke-linejoin: round; opacity: 0; }
  .m-hive-sheen { position: absolute; inset: 0; background: linear-gradient(105deg, transparent 30%, var(--cap) 50%, transparent 70%); opacity: 0; }
  .m-hive-grains { position: absolute; inset: 0; opacity: 0; }
  .m-hive-grain { position: absolute; width: 18%; height: 18%; clip-path: polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%); background: var(--crystal); opacity: 0; }
  .m-hive-lbl { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2px; line-height: 1.1; }
  .m-hive-lbl b { font-family: var(--display); font-weight: 800; font-size: max(11px, calc(var(--w) * 0.2)); }
  .m-hive-words { display: grid; }
  .m-hive-words > small { grid-area: 1 / 1; text-align: center; font-size: max(9px, calc(var(--w) * 0.095)); font-weight: 800; letter-spacing: 0.06em; }
  .m-hive-wfrom { opacity: 0; }
  .m-hive-star { width: calc(var(--w) * 0.32); height: calc(var(--w) * 0.32); }
  /* the five levels */
  .m-hive-cell.is-nectar { color: var(--on-nectar); }
  .m-hive-cell.is-nectar .m-hive-liq { height: 52%; }
  .m-hive-cell.is-nectar .m-hive-men { opacity: 1; }
  .m-hive-cell.is-honey { color: var(--on-honey); }
  .m-hive-cell.is-honey .m-hive-liq, .m-hive-cell.is-sealed .m-hive-liq, .m-hive-cell.is-crystal .m-hive-liq { height: 100%; color: var(--honey); }
  .m-hive-cell.is-sealed { color: var(--on-sealed); }
  .m-hive-cell.is-sealed .m-hive-liq { color: var(--sealed); }
  .m-hive-cell.is-sealed .m-hive-cap { transform: scale(1); }
  .m-hive-cell.is-crystal { color: var(--crystal-ink); }
  .m-hive-cell.is-crystal .m-hive-frost { opacity: 1; }
  /* every layer under the frost is crystal too, so no honey shows at the anti-aliased edge */
  .m-hive-cell.is-crystal .m-hive-body { background: var(--crystal); }
  .m-hive-cell.is-crystal .m-hive-liq { color: var(--crystal); }
  .m-hive-cell.is-crystal .m-hive-fac { opacity: 0.6; }
  /* level change: label ink and word cross-fade at --sw */
  .m-hive-from-empty { --from-ink: var(--lock-ink); }
  .m-hive-from-nectar { --from-ink: var(--on-nectar); }
  .m-hive-from-honey { --from-ink: var(--on-honey); }
  .m-hive-from .m-hive-lbl { animation: m-hive-inkfrom 260ms ease var(--sw, 0ms) both; }
  .m-hive-from .m-hive-wfrom { animation: m-hive-out 220ms ease var(--sw, 0ms) both; }
  .m-hive-from .m-hive-wto { animation: m-hive-in 220ms ease var(--sw, 0ms) both; }

  /* ---------- shared: solo stage (one big cell + topic + level pill) ---------- */
  .m-hive-solo { display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
  .m-hive-host { position: relative; display: inline-flex; }
  .m-hive-solo .m-hive-host { padding: 14px 22px; border-radius: 6px 6px 16px 16px; background: var(--slat); border: 1.5px solid var(--slat-edge); box-shadow: 0 2px 0 var(--slat-edge); }
  .m-hive-meta { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .m-hive-topic { font-size: 15px; font-weight: 800; }
  .m-hive-pills { display: grid; justify-items: center; }
  .m-hive-pills > * { grid-area: 1 / 1; }
  .m-hive-pill { height: 26px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 800; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .m-hive-pill-empty { background: var(--wax); color: var(--lock-ink); }
  .m-hive-pill-nectar { background: var(--nectar); color: var(--on-nectar); }
  .m-hive-pill-honey { background: var(--honey); color: var(--on-honey); }
  .m-hive-pill-sealed { background: var(--sealed); color: var(--on-sealed); }
  .m-hive-pill-crystal { background: var(--crystal); color: var(--crystal-ink); }
  .m-hive-pfrom { opacity: 0; animation: m-hive-out 220ms ease var(--sw) both; }
  .m-hive-pto { animation: m-hive-in 220ms ease var(--sw) both; }
  .m-hive-note { margin: 0; max-width: 300px; font-size: 13px; line-height: 1.45; color: var(--muted); animation: m-hive-in 300ms ease var(--sw) both; }

  /* ---------- 1. empty -> nectar ---------- */
  .m-hive-fn .m-hive-men { animation: m-hive-in 300ms ease 500ms both; }
  .m-hive-fn-a { --sw: 1150ms; }
  .m-hive-fn-a .m-hive-liq { animation: m-hive-rise 900ms cubic-bezier(.33,0,.2,1) 500ms both; }
  .m-hive-fn-b { --sw: 1300ms; }
  .m-hive-fn-b .m-hive-liq { animation: m-hive-rise 1100ms cubic-bezier(.33,0,.2,1) 400ms both; }
  .m-hive-fn-b .m-hive-wave { display: block; opacity: 0; animation: m-hive-calm 2200ms cubic-bezier(.45,0,.55,1) 400ms both; }
  .m-hive-fn-b .m-hive-wave svg { animation: m-hive-wave-x 1100ms linear 400ms 2; }
  .m-hive-fn-b .m-hive-men { animation: m-hive-in 600ms ease 1900ms both; }
  .m-hive-fn-c { --sw: 1450ms; padding-top: 24px; }
  .m-hive-fn-c .m-hive-liq { animation: m-hive-rise 800ms cubic-bezier(.33,0,.2,1) 860ms both; }
  .m-hive-fn-c .m-hive-men { animation: m-hive-in 200ms ease 860ms both, m-hive-wobble 700ms ease-out 1250ms both; }
  .m-hive-drop { position: absolute; left: 50%; top: 0; width: 24px; height: 24px; margin-left: -12px; opacity: 0; }
  .m-hive-drop svg { display: block; width: 100%; height: 100%; fill: var(--nectar); stroke: var(--honey); stroke-width: 1.6; }
  .m-hive-fn-c .m-hive-drop { animation: m-hive-fall 460ms cubic-bezier(.55,0,.85,.4) 400ms both; }
  .m-hive-ripple { position: absolute; left: 50%; bottom: 27px; width: 56px; margin-left: -28px; height: 10px; border-radius: 50%; border: 2px solid var(--honey); opacity: 0; }
  .m-hive-fn-c .m-hive-ripple { animation: m-hive-ripple 500ms ease-out 860ms both; }

  /* ---------- 2. nectar -> honey ---------- */
  .m-hive-nh .m-hive-men { opacity: 1; }
  .m-hive-nh-a, .m-hive-nh-c { --sw: 1150ms; }

  .m-hive-nh-b .m-hive-liq { animation: m-hive-rise52 600ms cubic-bezier(.33,0,.2,1) 450ms both, m-hive-col-nectar 350ms ease 750ms both; }
  .m-hive-nh-b .m-hive-sheen { animation: m-hive-sheen 750ms cubic-bezier(.4,0,.2,1) 1100ms both; }
  .m-hive-nh-b .m-hive-cell { animation: m-hive-pop 520ms cubic-bezier(.34,1.56,.64,1) 1050ms both; }
  .m-hive-nh-c .m-hive-halo { animation: m-hive-glow 700ms ease-out 1150ms both; }
  .m-hive-gain { position: absolute; top: 4px; left: calc(100% - 14px); display: inline-flex; align-items: center; gap: 4px; height: 28px; padding: 0 10px 0 7px; border-radius: 999px; background: var(--raised); color: var(--honey-text); font-size: 13px; font-weight: 800; white-space: nowrap; box-shadow: 0 2px 0 var(--honey-deep); }
  .m-hive-gain svg { width: 15px; height: 15px; fill: var(--honey); }
  .m-hive-nh-c .m-hive-gain { animation: m-hive-gain 1400ms cubic-bezier(.2,.8,.2,1) 1250ms both; }

  /* ---------- 3. honey -> sealed ---------- */
  .m-hive-sl .m-hive-liq { animation: m-hive-col-honey 350ms ease var(--dk) both; }
  .m-hive-sl-a { --dk: 600ms; --sw: 950ms; }
  .m-hive-sl-a .m-hive-cap { animation: m-hive-grow 460ms cubic-bezier(.34,1.56,.64,1) 750ms both; }

  .m-hive-sl-c .m-hive-cap { animation: m-hive-in 260ms ease 1300ms both; }

  .m-hive-cr .m-hive-liq { animation: m-hive-col-honey 1ms linear var(--lq) both; }
  .m-hive-cr-a { --sw: 1700ms; --lq: 2250ms; }
  .m-hive-cr-a .m-hive-frost { animation: m-hive-frost 1600ms cubic-bezier(.4,0,.2,1) 600ms both; }
  .m-hive-cr-a .m-hive-fac { animation: m-hive-fac-in 500ms ease 1900ms both; }
  .m-hive-cr-b { --sw: 1500ms; --lq: 2000ms; }
  .m-hive-cr-b .m-hive-fac { opacity: 0.6; }

  .m-hive-cr-c { --sw: 1900ms; --lq: 2150ms; }
  .m-hive-cr-c .m-hive-grain { animation: m-hive-grain 1300ms cubic-bezier(.4,0,.2,1) var(--gd, 500ms) both; }
  .m-hive-cr-c .m-hive-frost { animation: m-hive-in 600ms ease 1500ms both; }
  .m-hive-cr-c .m-hive-grains { animation: m-hive-out 200ms ease 2250ms both; }
  .m-hive-cr-c .m-hive-fac { animation: m-hive-fac-in 400ms ease 2300ms both; }

  /* ---------- shared: frames (çərçivə) and combs ---------- */
  .m-hive-over { font-size: 11px; font-weight: 800; letter-spacing: 0.08em; color: var(--muted); }

          if (red) { show(btn); return; }
          var down = v === 'B' ? 'translateY(3px) scale(0.92)' : 'scale(0.94)';
          if (auto) k.play(btn, [{ transform: 'scale(1)' }, { transform: down, offset: 0.4 }, { transform: 'scale(1)' }], { duration: 260, easing: OUT }, false);
          if (v === 'B') k.play(btn, [{ transform: 'scale(0.92)' }, { transform: 'scale(1.06)', offset: 0.45 }, { transform: 'scale(1)' }], { duration: 420, delay: auto ? 120 : 0, easing: 'ease-out' }, false);
          k.later(function () { show(btn); }, v === 'B' ? 160 : 120);
        }
        cells.forEach(function (c) {
          c.addEventListener('pointerdown', function () { c.classList.add('is-down'); });
          ['pointerup', 'pointerleave', 'pointercancel'].forEach(function (e) { c.addEventListener(e, function () { c.classList.remove('is-down'); }); });
          c.addEventListener('click', function () { tap(c, false); });
        });
        scrim.addEventListener('click', hide);
        sheet.querySelector('.m-hive-close').addEventListener('click', hide);
        k.later(function () { tap(cells[2], true); }, 700);
        return k.stop;
      });

      // 6. frame expand / collapse
      reg('hive.frame-toggle', function (stage, v, o) {
        var k = kit();
        var red = !!o.reduced;
        var root = stage.querySelector('.m-hive-tog');
        root.innerHTML = toggleHTML();
        hydrate(root);
        var frame = root.querySelectorAll('.m-hive-frame')[1];
        var slat = frame.querySelector('.m-hive-slat');
        var head = frame.querySelector('.m-hive-fhead');
        var panel = frame.querySelector('.m-hive-fpanel');
        var strip = frame.querySelector('.m-hive-strip');
        var chev = frame.querySelector('.m-hive-chev');
        var cells = all(panel, '.m-hive-cell');
        var minis = all(strip, '.m-hive-mini');
        var isOpen = false;
        var busy = false;
        panel.style.height = '0px';
        var stripW = strip.scrollWidth;
        // The strip gives its width back to the subtitle while the frame is open.
        function stripTo(show, dur, delay) {
          return k.play(strip, [
            { opacity: show ? 0 : 1, maxWidth: (show ? 0 : stripW) + 'px', marginRight: (show ? 0 : 8) + 'px' },
            { opacity: show ? 1 : 0, maxWidth: (show ? stripW : 0) + 'px', marginRight: (show ? 8 : 0) + 'px' }
          ], { duration: dur, delay: delay || 0, easing: OUT });
        }
        function stripSet(show) {
          strip.style.opacity = show ? '1' : '0';
          strip.style.maxWidth = show ? stripW + 'px' : '0px';
          strip.style.marginRight = show ? '8px' : '0px';
        }
        function natural() { var h0 = panel.style.height; panel.style.height = 'auto'; var h = panel.offsetHeight; panel.style.height = h0; return h; }
        function centre(r) { return [r.left + r.width / 2, r.top + r.height / 2]; }
        function flipFrames(i, toStrip) {
          var m = minis[i].getBoundingClientRect();
          var r = cells[i].getBoundingClientRect();
          var cm = centre(m);
          var cr = centre(r);
          var t = 'translate(' + (cm[0] - cr[0]) + 'px, ' + (cm[1] - cr[1]) + 'px) scale(' + (m.width / r.width) + ')';
          return toStrip ? [{ transform: 'translate(0px, 0px) scale(1)' }, { transform: t }] : [{ transform: t }, { transform: 'translate(0px, 0px) scale(1)' }];
        }
        function openIt() {
          if (busy || isOpen) return;
          busy = true;
          isOpen = true;
          head.setAttribute('aria-expanded', 'true');
          slat.classList.add('is-open');
          var H = natural();
          if (red) {
            panel.style.height = 'auto';
            stripSet(false);
            chev.style.transform = 'rotate(180deg)';
            k.play(panel, [{ opacity: 0 }, { opacity: 1 }], { duration: 150 });
            busy = false;
            return;
          }
          k.play(chev, [{ transform: 'rotate(0deg)' }, { transform: 'rotate(180deg)' }], { duration: 220, easing: OUT });
          if (v === 'C') {
            var frames = cells.map(function (c, i) { return flipFrames(i, false); });
            panel.style.overflow = 'visible';
            strip.style.opacity = '0';
            k.play(strip, [{ maxWidth: stripW + 'px', marginRight: '8px' }, { maxWidth: '0px', marginRight: '0px' }], { duration: 220, delay: 300, easing: OUT });
            k.play(panel, [{ height: '0px' }, { height: H + 'px' }], { duration: 380, easing: OUT });
            cells.forEach(function (c, i) { k.play(c, frames[i], { duration: 460, delay: i * 40, easing: OUT }); });
            k.later(function () { panel.style.height = 'auto'; panel.style.overflow = ''; busy = false; }, 460 + cells.length * 40 + 20);
            return;
          }
          var ph = k.play(panel, [{ height: '0px' }, { height: H + 'px' }], { duration: v === 'B' ? 280 : 320, easing: OUT });
          if (ph) ph.finished.then(function () { panel.style.height = 'auto'; busy = false; }, function () {});
          stripTo(false, 200);
          if (v === 'A') {
            cells.forEach(function (c, i) {
              k.play(c, [{ opacity: 0, transform: 'translateY(8px) scale(0.9)' }, { opacity: 1, transform: 'translateY(0px) scale(1)' }], { duration: 240, delay: 80 + i * 45, easing: OUT });
            });
          } else {
            var here = centre(cells[2].getBoundingClientRect());
            cells.forEach(function (c) {
              var p = centre(c.getBoundingClientRect());
              var dist = Math.hypot(p[0] - here[0], p[1] - here[1]);
              k.play(c, [{ opacity: 0, transform: 'scale(0)' }, { opacity: 1, transform: 'scale(1)' }], { duration: 360, delay: 60 + dist * 1.1, easing: SPRING });
            });
          }
        }
        function closeIt() {
          if (busy || !isOpen) return;
          busy = true;
          isOpen = false;
          head.setAttribute('aria-expanded', 'false');
          var H = panel.offsetHeight;
          if (red) {
            panel.style.height = '0px';
            stripSet(true);
            chev.style.transform = 'rotate(0deg)';
            slat.classList.remove('is-open');
            busy = false;
            return;
          }
          k.play(chev, [{ transform: 'rotate(180deg)' }, { transform: 'rotate(0deg)' }], { duration: 220, easing: OUT });
          if (v === 'C') {
            var frames = cells.map(function (c, i) { return flipFrames(i, true); });
            panel.style.overflow = 'visible';
            k.play(strip, [{ maxWidth: '0px', marginRight: '0px' }, { maxWidth: stripW + 'px', marginRight: '8px' }], { duration: 220, easing: OUT });
            k.play(panel, [{ height: H + 'px' }, { height: '0px' }], { duration: 420, delay: 120, easing: OUT });
            cells.forEach(function (c, i) { k.play(c, frames[i], { duration: 420, delay: (cells.length - 1 - i) * 40, easing: 'cubic-bezier(.4,0,.2,1)' }); });
            k.later(function () {
              panel.style.overflow = '';
              strip.style.opacity = '1';
              slat.classList.remove('is-open');
              busy = false;
            }, 420 + cells.length * 40 + 20);
            return;
          }
          cells.forEach(function (c) { k.play(c, [{ opacity: 1 }, { opacity: 0 }], { duration: 120 }); });
          var ph = k.play(panel, [{ height: H + 'px' }, { height: '0px' }], { duration: 260, delay: 60, easing: OUT });
          stripTo(true, 220, 160);
          if (ph) ph.finished.then(function () { slat.classList.remove('is-open'); busy = false; }, function () {});
        }
        head.addEventListener('click', function () { if (isOpen) closeIt(); else openIt(); });
        k.later(openIt, 600);
        return k.stop;
      });

      // 7. placement result -> known cells fill, start cell pulses
      reg('hive.placement-result', function (stage, v, o) {
        var k = kit();
        var red = !!o.reduced;
        var root = stage.querySelector('.m-hive-pr');
        root.innerHTML = placeHTML(v === 'C');
        hydrate(root);
        var count = root.querySelector('.m-hive-count');
        var rows = all(root, '.m-hive-pr-row');
        var start = root.querySelector('.m-hive-pr-start');
        var startCell = start.querySelector('.m-hive-cell');
        var vz = root.querySelector('.m-hive-pr-vz');
        if (vz) vz.innerHTML = window.Lab.vizi('sevinc', 64);
        var ev = [];
        var seq = 0;
        rows.forEach(function (row, r) {
          all(row, '.m-hive-pm-f').forEach(function (f, c) {
            var nectar = r === 3 && c === 2;
            if (c >= UNITS[r][3] && !nectar) return;
            if (nectar) f.classList.add('is-n');
            var t;
            if (v === 'A') t = 400 + (nectar ? 17 * 65 + 200 : seq * 65);
            else if (v === 'B') t = 400 + r * 260 + c * 35 + (nectar ? 300 : 0);
            else t = 400 + (r + c) * 70 + (nectar ? 300 : 0);
            ev.push({ f: f, r: r, nectar: nectar, t: t });
            if (!nectar) seq += 1;
          });
        });
        var endT = Math.max.apply(null, ev.map(function (e) { return e.t; })) + 300;
        var done = rows.map(function () { return 0; });
        var total = 0;
        function badge(r) {
          var u = UNITS[r];
          var b = rows[r].querySelector('.m-hive-pr-badge');
          b.classList.remove('m-hive-k-empty');
          b.classList.add(u[3] === u[2] ? 'm-hive-k-honey' : 'm-hive-k-nectar');
        }
        function bump(r) {
          total += 1;
          done[r] += 1;
          count.textContent = String(total);
          var n = rows[r].querySelector('.m-hive-pr-n');
          n.textContent = done[r] + ' / ' + UNITS[r][2];
          n.classList.add('is-on');
          if (done[r] === UNITS[r][3]) badge(r);
        }
        if (red) {
          ev.forEach(function (e) { e.f.style.transform = 'scaleY(1)'; if (!e.nectar) bump(e.r); });
          return k.stop;
        }
        ev.forEach(function (e) {
          var frames = v === 'C' ? [{ transform: 'scaleY(1)', opacity: 0 }, { transform: 'scaleY(1)', opacity: 1 }] : [{ transform: 'scaleY(0)' }, { transform: 'scaleY(1)' }];
          k.play(e.f, frames, { duration: v === 'C' ? 300 : 220, delay: e.t, easing: 'cubic-bezier(.33,0,.2,1)' });
          if (!e.nectar) k.later(function () { bump(e.r); }, e.t + 110);
        });
        k.play(start, [{ opacity: 0, transform: 'translateY(12px)' }, { opacity: 1, transform: 'translateY(0px)' }], { duration: 300, delay: endT, easing: OUT });
        k.play(startCell.querySelector('.m-hive-pulse'), [{ opacity: 0.6, transform: 'scale(1)' }, { opacity: 0, transform: 'scale(1.5)' }], { duration: 1200, delay: endT + 300, iterations: 2, easing: OUT }, false);
        if (vz) k.play(vz, [{ opacity: 0, transform: 'translateY(10px) scale(0.6)' }, { opacity: 1, transform: 'translateY(0px) scale(1)' }], { duration: 520, delay: endT - 100, easing: SPRING });
        return k.stop;
      });

      // 8. unit sealed: the motion is CSS; the script builds the frame and adds Vızı to B
      reg('hive.unit-sealed', function (stage, v) {
        var root = stage.querySelector('.m-hive-us');
        root.innerHTML = sealedHTML(v);
        hydrate(root);
        var vz = root.querySelector('.m-hive-us-vz');
        if (vz) vz.innerHTML = window.Lab.vizi('bayram', 80);
      });

      // 9. current cell attention: CSS loops (3 cycles), the script only builds the frame
      reg('hive.current-pulse', function (stage) {
        var root = stage.querySelector('.m-hive-cp');
        root.innerHTML = currentHTML();
        hydrate(root);
      });
    }

    if (window.Lab) boot(); else document.addEventListener('DOMContentLoaded', boot);
  })();
</script>

<section class="lab-section" id="sec-transitions" data-title="Ekran keçidləri" data-lead="Ekranlar, alt pəncərələr və bildirişlər necə gəlib-gedir: hərəkət istiqaməti göstərir, diqqəti dərsdən yayındırmır.">

    <template data-variant="C" data-label="Böyümə" data-spec="Container transform: the new screen grows out of the tapped row (its clip goes from the row's rect to the full screen, 400ms · cubic-bezier(.2,.8,.2,1)); the row's own content fades out on top in 200ms, the new content fades in 220ms from 120ms; the list behind goes scale 1→0.94 under a 0→30% scrim; back 340ms · cubic-bezier(.4,0,.2,1) into the same row · once · RN: measure(rowRef) → absolute Animated.View withTiming on its layout, router.push with animation:'none' underneath (Reanimated sharedTransitionTag is still experimental in v4) · haptic Light on row press · reduced motion: 150ms cross-fade"><div class="m-transitions-rig" data-m="push"></div></template>

  </article>

  <article class="sample" data-id="transitions.dialog" data-title="Təsdiq pəncərəsi" data-when="Testdən çıxmaq istəyəndə və digər «əminsən?» anlarında">
    <template data-variant="A" data-label="Sakit" data-spec="In 200ms · cubic-bezier(.2,.8,.2,1): scrim 0→1, card opacity 0→1 + scale 0.96→1; out 150ms · cubic-bezier(.4,0,1,1) to scale 0.98 · once · RN: Modal transparent animationType='none'; scrim entering={FadeIn.duration(200)}, card entering={new Keyframe({0:{opacity:0, transform:[{scale:0.96}]}, 100:{opacity:1, transform:[{scale:1}]}}).duration(200)}, exiting={FadeOut.duration(150)}; focus moves to DAVAM ET · no haptic · reduced motion: 150ms fade"><div class="m-transitions-rig" data-m="dialog"></div></template>

  <article class="sample" data-id="transitions.skeleton" data-title="Yüklənmə skeleti" data-when="Bu gün ekranı və siyahılar məlumat gələnə qədər; sonra məzmun skeletin yerinə keçir">

      side('<b>Toxun:</b> variant seç və «Davam et». Vızı yerində qalır, dəyişən yalnız sualdır. «Başlayaq» onu yenidən birinci addıma qaytarır.');
    const stageEl = k.q('.' + X + 'onbstage'), prev = k.q('[data-prev]'), cta = k.q('[data-next]'), count = k.q('[data-count]'), progEl = k.q('.' + X + 'prog');
    const vzWrap = k.q('.' + X + 'onbvizi'), layers = k.qa('.' + X + 'vz');

      const t = tslot.firstElementChild;
      if (k.reduced) await fadeIn(k, t, 150);
      else if (v === 'A') await k.play(t, [{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'translateY(0)' }], { duration: 220, easing: CE.out });
      else {
        t.style.transform = 'translateY(64px)';
        fadeIn(k, t, 120);
        await k.spring('toast', 64, 0, { damping: 16, stiffness: 220, eps: 0.3 }, (y) => { t.style.transform = `translateY(${y}px)`; });
      }
      await k.wait(1800);
      if (my !== tgen) return;
      if (k.reduced || v === 'A') await fadeOut(k, t, 150);
      else await k.play(t, [{ opacity: 0, transform: 'translateY(24px)' }], { duration: 180, easing: CE.in });
      if (my === tgen) tslot.innerHTML = '';
    }

    /* --- C: one capsule at the top --- */
    const ic = isl && isl.querySelector('.' + X + 'isic'), tx = isl && isl.querySelector('.' + X + 'istx');
    let shown = false;
    const fullWidth = () => { const prev = isl.style.width; isl.style.width = 'max-content'; const w = isl.offsetWidth; isl.style.width = prev; return w; };
    const widthTo = (w, cfg) => (k.reduced ? Promise.resolve((isl.style.width = w + 'px', true)) : k.spring('isl', isl.offsetWidth, w, Object.assign({ eps: 0.3 }, cfg), (x) => { isl.style.width = x + 'px'; }));
    async function capsule(icon, text, hold) {
      const my = ++igen;
      isl.hidden = false;
      if (shown) { await k.play(tx, [{ opacity: 0 }], { duration: 100 }); if (my !== igen) return; }
      ic.innerHTML = svg(icon, 12);
      tx.textContent = text;
      tx.style.opacity = '0';
      const w = fullWidth();
      if (!shown) {
        shown = true;
        isl.style.width = '24px';
        k.play(isl, k.reduced ? [{ opacity: 0 }, { opacity: 1 }] : [{ opacity: 0, transform: 'scale(.8)' }, { opacity: 1, transform: 'scale(1)' }], { duration: 150, easing: CE.out });
      }
      widthTo(w, { damping: 18, stiffness: 220 });
      k.play(tx, [{ opacity: 0 }, { opacity: 1 }], { duration: 160, delay: k.reduced ? 0 : 120 });
      await k.wait(hold);
      if (my !== igen) return;
      await k.play(tx, [{ opacity: 0 }], { duration: 100 });
      if (my !== igen) return;
      if (offline) {
        ic.innerHTML = svg('offline', 12);
        tx.textContent = 'Oflayn';
        widthTo(fullWidth(), { damping: 20, stiffness: 240 });
        k.play(tx, [{ opacity: 0 }, { opacity: 1 }], { duration: 160, delay: k.reduced ? 0 : 80 });
        return;
      }
      await widthTo(24, { damping: 22, stiffness: 260 });
      if (my !== igen) return;
      await k.play(isl, k.reduced ? [{ opacity: 0 }] : [{ opacity: 0, transform: 'scale(.8)' }], { duration: 150, easing: CE.in });
      if (my !== igen) return;
      isl.hidden = true;
      shown = false;
    }

    async function setNet(off) {
      offline = off;
      net.setAttribute('aria-pressed', String(off));
      net.querySelector('span').textContent = off ? 'İnterneti qaytar' : 'İnterneti kəs';
      if (v === 'C') { capsule(off ? 'offline' : 'check', off ? 'İnternet yoxdur' : 'Yenidən onlayn', off ? 2200 : 1400); return; }
      const my = ++bgen;
      await bannerIn(off ? 'off' : 'on', my);
      if (off || my !== bgen) return;
      await k.wait(1400);
      if (my === bgen) bannerOut(my);
    }
    k.on(net, 'click', () => setNet(!offline));
    k.on(k.q('[data-save]'), 'click', () => { if (v === 'C') capsule('check', 'Yadda saxlandı', 1500); else toast(); });
    k.on(k.q('.' + X + 'chips'), 'click', (e) => {
      const b = e.target.closest('[data-j]');
      if (!b) return;
      k.qa('[data-j]', b.parentElement).forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    });
  };

  /* ======================= 10. test → result hand-off ======================= */
  S.handoff = function (k, host, v) {
    const opts = QOPTS.map(([l, t]) => (l === 'C'
      ? `<span class="${X}opt" data-s="ok"><span class="${X}optl">${l}</span>${t}<em>${svg('check', 9)}Düz</em></span>`
      : `<span class="${X}opt" data-s="dim"><span class="${X}optl">${l}</span>${t}</span>`)).join('');
    const srcHex = `<span class="${X}hex" data-l="nektar" data-src aria-label="Hüceyrə 4.3, Nektar"><span class="${X}hexlbl">4.3</span></span>`;
    host.innerHTML = phone('Mövzu testi və nəticə',
      `<div class="${X}view" data-v="test">${testTop(10, srcHex)}<div class="${X}body"><span class="${X}cap">MÖVZU TESTİ · 4.3</span><p class="${X}q">(2x + 1)³ ifadəsini çoxhədli şəklində yazın.</p>` +
      `<div class="${X}opts">${opts}</div>${src('4.3', 's. 93')}</div><div class="${X}foot"><div class="${X}fb" role="status">${svg('check', 12)}<span><b>Düz cavab.</b> Bu, testin son sualı idi.</span></div>` +
      `<button type="button" class="${X}cta" data-go>NƏTİCƏYƏ BAX</button></div></div>` +
      `<div class="${X}view" data-v="res" hidden><div class="${X}top ${X}toprow"><button type="button" class="${X}ib" data-again aria-label="Bağla">${svg('close', 14)}</button><span class="${X}cap">MÖVZU TESTİ · 4.3</span></div>` +
      `<div class="${X}body"><div class="${X}resvz" aria-hidden="true">${vizi('sevinc', 56)}</div>` +
      `<div class="${X}score"${v === 'C' ? ' data-honey' : ''}><span class="${X}big" data-score>8 / 10</span><span class="${X}scoretx">Əla iş! Səhvlər də öyrənməyin bir hissəsidir.</span><span class="${X}pill" data-k="honey" data-xp>${svg('drop', 9)}+15 bal</span></div>` +
      `<div class="${X}card ${X}goal ${X}cellcard"><span class="${X}hex ${X}hexl" data-l="nektar" data-target><span class="${X}hexfill"></span><span class="${X}hexlbl">4.3</span></span>` +
      `<span class="${X}col"><b data-lvl>Nektar · öyrənilir</b><small data-sub>Test bitdi, hüceyrə dolur…</small></span></div>` +
      `<span class="${X}grow"></span><button type="button" class="${X}cta" data-again>DAVAM ET</button></div></div>`) +
      side('<b>Toxun:</b> «Nəticəyə bax». Nəticədə «Davam et» testi yenidən göstərir.');
    const scr = k.q('.' + X + 'screen'), test = k.q('[data-v="test"]'), res = k.q('[data-v="res"]');
    const scoreEl = k.q('[data-score]'), xp = k.q('[data-xp]'), target = k.q('[data-target]'), fill = k.q('[data-target] .' + X + 'hexfill');
    const lvl = k.q('[data-lvl]'), sub = k.q('[data-sub]'), score = k.q('.' + X + 'score'), from = k.q('[data-src]');
    let busy = false;
    const rel = (el) => { const s = scr.getBoundingClientRect(), r = el.getBoundingClientRect(); return { l: r.left - s.left, t: r.top - s.top, w: r.width, h: r.height, W: s.width, H: s.height }; };

    function resetResult() {
      [scoreEl, xp, fill, target, score].forEach((el) => el.getAnimations().forEach((a) => a.cancel()));
      scoreEl.textContent = '0 / 10';
      xp.style.opacity = '0';
      fill.style.height = '0';
      target.dataset.l = 'nektar';
      lvl.textContent = 'Nektar · öyrənilir';
      sub.textContent = 'Test bitdi, hüceyrə dolur…';
    }
    function finalState() {
      scoreEl.textContent = '8 / 10';
      xp.style.opacity = '1';
      target.dataset.l = 'bal';
      fill.style.height = '0';
      lvl.textContent = 'Bal · mənimsənilib';
      sub.textContent = '2 gündən sonra ilk təkrar gələcək.';
    }
    async function celebrate() {
      k.tween('score', 0, 8, 600, EASE.out, (x) => { scoreEl.textContent = Math.round(x) + ' / 10'; });
      await k.wait(250);
      await k.play(fill, [{ height: '0%' }, { height: '100%' }], { duration: 400, easing: CE.out });
      finalState();
      xp.style.opacity = '0';
      await k.play(xp, [{ opacity: 0, transform: 'scale(.9)' }, { opacity: 1, transform: 'scale(1)' }], { duration: 200, easing: CE.out });
    }
    async function go() {
      if (busy) return;
      busy = true;
      resetResult();
      if (k.reduced) {
        finalState();
        res.hidden = false;
        fadeOut(k, test, 150);
        await fadeIn(k, res, 150);
        test.hidden = true;
      } else if (v === 'A') {
        res.hidden = false;
        k.play(test, [{ opacity: 1 }, { opacity: 0 }], { duration: 150, easing: CE.in });
        await k.play(res, [{ opacity: 0 }, { opacity: 1 }], { duration: 220, delay: 100, easing: 'ease-out' });
        test.hidden = true;
        await celebrate();
      } else if (v === 'B') {
        const a = rel(from);
        res.hidden = false;
        res.style.opacity = '0';
        const b = rel(target);
        const fly = document.createElement('span');
        fly.className = X + 'hex ' + X + 'flyer';
        fly.dataset.l = 'nektar';
        fly.innerHTML = `<span class="${X}hexlbl">4.3</span>`;
        scr.appendChild(fly);
        from.style.visibility = 'hidden';
        target.style.visibility = 'hidden';
        k.play(test, [{ opacity: 1 }, { opacity: 0 }], { duration: 200, easing: CE.in });
        k.play(res, [{ opacity: 0 }, { opacity: 1 }], { duration: 260, delay: 120, easing: 'ease-out' });
        await k.play(fly, [
          { left: a.l + 'px', top: a.t + 'px', width: a.w + 'px', height: a.h + 'px', fontSize: '8px' },
          { left: b.l + 'px', top: b.t + 'px', width: b.w + 'px', height: b.h + 'px', fontSize: '11px' },
        ], { duration: 420, easing: CE.out });
        target.style.visibility = '';
        fly.remove();
        test.hidden = true;
        from.style.visibility = '';
        await celebrate();
      } else {
        const c = rel(k.q('[data-go]'));
        const cx = c.l + c.w / 2, cy = c.t + c.h / 2, R = Math.hypot(Math.max(cx, c.W - cx), Math.max(cy, c.H - cy)) + 4;
        const cur = document.createElement('div');
        cur.className = X + 'curtain';
        scr.appendChild(cur);
        await k.play(cur, [{ clipPath: `circle(0px at ${cx}px ${cy}px)` }, { clipPath: `circle(${R}px at ${cx}px ${cy}px)` }], { duration: 400, easing: CE.inOut });
        test.hidden = true;
        res.hidden = false;
        res.style.opacity = '1';
        const kids = Array.from(score.children);
        kids.forEach((el) => { el.style.opacity = '0'; });
        const s = rel(score);
        await k.play(cur, [{ clipPath: 'inset(0px 0px 0px 0px round 0px)' }, { clipPath: `inset(${s.t}px ${s.W - s.l - s.w}px ${s.H - s.t - s.h}px ${s.l}px round 14px)` }], { duration: 400, easing: CE.out });
        cur.remove();
        kids.forEach((el) => { if (el !== xp) k.play(el, [{ opacity: 0 }, { opacity: 1 }], { duration: 160, easing: 'ease-out' }); });
        await celebrate();
      }
      busy = false;
      focus(res.querySelector('.' + X + 'cta'));
    }
    async function again() {
      if (busy) return;
      busy = true;
      test.hidden = false;
      fadeIn(k, test, 150);
      await fadeOut(k, res, 150);
      res.hidden = true;
      busy = false;
      focus(k.q('[data-go]'));
    }
    k.on(k.q('[data-go]'), 'click', go);
    k.on(res, 'click', (e) => { if (e.target.closest('[data-again]')) again(); });
  };


  /* ---------- registration (the section script runs before the lab runtime, so wait for it) ---------- */
  function boot() {
    if (!window.Lab || !window.Lab.register) return false;
    Object.keys(S).forEach((slug) => {
      window.Lab.register('transitions.' + slug, (stage, variant, opts) => {
        const k = kit(stage, !!(opts && opts.reduced));
        const host = stage.querySelector('[data-m]');
        if (host) { try { S[slug](k, host, variant); } catch (e) { console.error('transitions.' + slug, e); } }
        return () => k.stop();
      });
    });
    // If the cards were built before this ran, remount the ones that are still empty.
    document.querySelectorAll('#sec-transitions .sample').forEach((card) => {
      const h = card.querySelector('.stage [data-m]');
      const r = card.querySelector('.replay');
      if (h && r && !h.firstChild) r.click();
    });
    return true;
  }
  if (!boot()) document.addEventListener('DOMContentLoaded', boot, { once: true });
})();
</script>

        return;
      }
      // C: a ghost of the code flies into the button.
      if (busy) { copied(); return; }
      busy = true;
      const cr = card.getBoundingClientRect();
      const a = code.getBoundingClientRect();
      const b = btn.getBoundingClientRect();
      const g = document.createElement('span');
      g.className = 'm-micro-copy-ghost';
      g.textContent = '7B-4KQ2';
      g.style.left = (a.left - cr.left) + 'px';
      g.style.top = (a.top - cr.top) + 'px';
      card.appendChild(g);
      const dx = (b.left + b.width / 2) - (a.left + a.width / 2);
      const dy = (b.top + b.height / 2) - (a.top + a.height / 2);
      S.anim(g, [
        { transform: 'translate(0, 0) scale(1)', opacity: 0.9 },
        { transform: 'translate(0, -6px) scale(1.04)', opacity: 1, offset: 0.23 },
        { transform: 'translate(' + dx + 'px, ' + dy + 'px) scale(.3)', opacity: 0 },
      ], { duration: 520, easing: EOUT, fill: 'forwards' });
      S.after(520, function () {
        g.remove();
        copied();
        pop(S, btn, 1.06);
      });
    };
    S.on(btn, 'click', function () { run(true); });
    S.after(900, function () { run(false); });
    return S.stop;
  });

  /* ---------- micro.header ---------- */
  // Demo student Nərmin: s = Möhürlü, b = Bal, c = Kristallaşıb, n = Nektar (current), e = Boş.
  const UNITS = [
    ['1. Rasional ədədlər', 's s s s b b'],
    ['2. Natural üstlü qüvvət', 'b c b b'],
    ['3. Birhədlilər və çoxhədlilər', 'c b b s s'],
    ['4. Müxtəsər vurma düsturları', 'b b n e e'],
    ['5. Dördbucaqlılar', 'e e e e e e'],
  ];
  const unitsHTML = function () {
    return UNITS.map(function (u, ui) {
      const st = u[1].split(' ');
      const done = st.filter(function (x) { return x === 's' || x === 'b'; }).length;
      const cells = st.map(function (x, i) { return '<span class="m-micro-hx is-' + x + '"><span>' + (ui + 1) + '.' + (i + 1) + '</span></span>'; }).join('');
      return '<div class="m-micro-unit" data-name="' + u[0] + '"><div class="m-micro-unit-h"><b>' + u[0] + '</b><span>' + done + ' / ' + st.length + '</span></div><div class="m-micro-unit-cells" aria-hidden="true">' + cells + '</div></div>';
    }).join('');
  };
  reg('micro.header', function (stage, v, o) {
    const S = scope();
    const root = $(stage, '.m-micro-head');
    const sc = $(root, '.m-micro-head-scroll');
    const small = $(root, '.m-micro-head-small');
    $(root, '.m-micro-head-list').innerHTML = unitsHTML();
    const units = $$(root, '.m-micro-unit');
    let cur = 'Öyrən';
    const setTitle = function (t) {
      if (t === cur) return;
      cur = t;
      if (o.reduced || !root.classList.contains('is-collapsed')) { small.textContent = t; return; }
      S.anim(small, [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(-6px)' }], { duration: 120, easing: 'ease-in', fill: 'forwards' });
      S.after(120, function () {
        if (cur !== t) return;
        small.getAnimations().forEach(function (a) { a.cancel(); });
        small.textContent = t;
        S.anim(small, [{ opacity: 0, transform: 'translateY(6px)' }, { opacity: 1, transform: 'none' }], { duration: 220, easing: EOUT });
      });
    };
    const onScroll = function () {
      const y = sc.scrollTop;
      const p = Math.max(0, Math.min(1, y / 56));
      root.style.setProperty('--p', p.toFixed(3));
      root.classList.toggle('is-collapsed', y > 44);
      if (v === 'C') {
        let name = 'Öyrən';
        if (y > 44) units.forEach(function (u) { if (u.offsetTop - 50 <= y) name = u.dataset.name; });
        setTitle(name);
      }
    };
    let auto = !o.reduced;
    const stopAuto = function () { auto = false; };
    S.on(sc, 'scroll', onScroll, { passive: true });
    ['wheel', 'touchstart', 'pointerdown', 'keydown'].forEach(function (ev) { S.on(sc, ev, stopAuto, { passive: true }); });
    const glide = function (to, ms, done) {
      const from = sc.scrollTop;
      S.tween(ms, ease.inOut, function (p) { if (auto) sc.scrollTop = from + (to - from) * p; }, done);
    };
    onScroll();
    if (auto) {
      S.after(800, function () {
        if (!auto) return;
        glide(Math.min(360, sc.scrollHeight - sc.clientHeight), 1800, function () {
          S.after(1100, function () { if (auto) glide(0, 1300); });
        });
      });
    }
    return S.stop;
  });

  /* ---------- micro.timer ---------- */
  reg('micro.timer', function (stage, v, o) {
    const S = scope();
    const root = $(stage, '.m-micro-timer');
    const time = $(root, '.m-micro-timer-time');
    const bar = $(root, '.m-micro-ring-bar');
    const chip = $(root, '.m-micro-timer-chip');
    const halo = $(root, '.m-micro-timer-halo');
    const warnEl = $(root, '.m-micro-timer-warnin');
    const TOTAL = 60 * 60;
    const WARN = 5 * 60;
    const NOTE = {
      A: '5 dəqiqə qaldı. Cavablarını yoxlamağa vaxtın var.',
      B: 'Son 5 dəqiqə — cavablarını yoxla.',
      C: '5 dəqiqə qaldı. Tələsmə, cavablarını yoxla.',
    };
    let left = 48 * 60 + 12;
    let warned = false;
    let ff = false;
    const two = function (n) { return String(n).padStart(2, '0'); };
    const warnNow = function () {
      warned = true;
      warnEl.innerHTML = SVG(v === 'C' ? ICON.info : v === 'B' ? ICON.warning : ICON.clock, 18) + '<span>' + NOTE[v] + '</span>';
      root.classList.add('is-warn');
      if (v === 'A' && !o.reduced) S.anim(halo, [{ transform: 'scale(1)', opacity: 0.75 }, { transform: 'scale(1.45)', opacity: 0 }], { duration: 900, easing: 'ease-out' });
    };
    const paint = function () {
      time.textContent = two(Math.floor(left / 60)) + ':' + two(left % 60);
      bar.style.strokeDashoffset = String(100 - (left / TOTAL) * 100);
      chip.setAttribute('aria-label', 'Qalan vaxt: ' + Math.floor(left / 60) + ' dəqiqə ' + (left % 60) + ' saniyə');
      if (!warned && left <= WARN) warnNow();
    };
    paint();
    S.every(1000, function () { if (ff || left <= 0) return; left -= 1; paint(); });
    // Demo: after two real ticks, fast-forward to 05:03 so the last-minutes state shows.
    S.after(2100, function () {
      ff = true;
      root.classList.add('is-ff');
      const from = left;
      const to = WARN + 2;
      S.tween(o.reduced ? 1 : 1000, ease.inOut, function (p) { left = Math.round(from + (to - from) * p); paint(); }, function () {
        ff = false;
        root.classList.remove('is-ff');
      });
    });
    return S.stop;
  });

  /* ---------- micro.camera ---------- */
  reg('micro.camera', function (stage, v, o) {
    const S = scope();
    const root = $(stage, '.m-micro-cam');
    const phone = $(root, '.m-micro-cam-phone');
    const win = $(root, '.m-micro-cam-window');
    const shutter = $(root, '.m-micro-cam-shutter');
    const thumb = $(root, '.m-micro-cam-thumb');
    const timg = $(root, '.m-micro-cam-thumbimg');
    const count = $(root, '.m-micro-cam-count');
    const sheet = $(root, '.m-micro-cam-sheet');
    const sr = $(root, '[role="status"]');
    let shots = 0;
    let busy = false;
    const press = function () { shutter.classList.add('is-down'); S.after(120, function () { shutter.classList.remove('is-down'); }); };
    const landThumb = function () {
      shots += 1;
      count.textContent = String(shots);
      root.classList.add('has-shot');
      if (!o.reduced) {
        S.anim(timg, [{ opacity: 0, transform: 'scale(.6)' }, { opacity: 1, transform: 'scale(1)' }], { duration: 220, easing: EOUT });
        S.anim(count, [{ transform: 'scale(.4)' }, { transform: 'scale(1.15)', offset: 0.6 }, { transform: 'scale(1)' }], { duration: 260, easing: EOUT });
      }
      sr.textContent = 'Şəkil çəkildi: ' + shots;
      busy = false;
    };
    const fly = function () {
      const pr = phone.getBoundingClientRect();
      const wr = win.getBoundingClientRect();
      const tr = thumb.getBoundingClientRect();
      const f = document.createElement('span');
      f.className = 'm-micro-cam-fly';
      f.style.left = (wr.left - pr.left) + 'px';
      f.style.top = (wr.top - pr.top) + 'px';
      f.style.width = wr.width + 'px';
      f.style.height = wr.height + 'px';
      phone.appendChild(f);
      const dx = (tr.left + tr.width / 2) - (wr.left + wr.width / 2);
      const dy = (tr.top + tr.height / 2) - (wr.top + wr.height / 2);
      S.anim(f, [{ transform: 'translate(0, 0) scale(1, 1)', opacity: 1 }, { transform: 'translate(' + dx + 'px, ' + dy + 'px) scale(' + (tr.width / wr.width) + ', ' + (tr.height / wr.height) + ')', opacity: 0.9 }], { duration: 420, easing: EOUT, fill: 'forwards' });
      S.after(420, function () { f.remove(); landThumb(); });
    };
    const openSheet = function () {
      root.classList.add('is-dim');
      sheet.hidden = false;
      S.anim(sheet, o.reduced ? [{ opacity: 0 }, { opacity: 1 }] : [{ transform: 'translateY(100%)' }, { transform: 'translateY(0)' }], { duration: o.reduced ? 150 : 220, easing: EOUT });
      sr.textContent = 'Şəkil çəkildi. Davam edə və ya yenidən çəkə bilərsən.';
      busy = false;
    };
    const shoot = function () {
      if (busy || (v === 'C' && !sheet.hidden)) return;
      busy = true;
      press();
      if (o.reduced) { if (v === 'C') openSheet(); else landThumb(); return; }
      if (v === 'A') {
        S.anim($(root, '.m-micro-cam-flash'), [{ opacity: 0 }, { opacity: 0.75, offset: 0.27 }, { opacity: 0 }], { duration: 220, easing: 'ease-out' });
        S.after(160, landThumb);
      } else if (v === 'B') {
        $$(root, '.m-micro-cam-lid').forEach(function (l) {
          S.anim(l, [{ transform: 'scaleY(0)' }, { transform: 'scaleY(1)', offset: 0.39 }, { transform: 'scaleY(1)', offset: 0.45 }, { transform: 'scaleY(0)' }], { duration: 230, easing: 'ease-in-out' });
        });
        S.after(230, fly);
      } else {
        root.classList.add('is-dim');
        S.anim(win, [{ transform: 'scale(1)' }, { transform: 'scale(.96)', offset: 0.4 }, { transform: 'scale(1)' }], { duration: 220, easing: EOUT });
        S.after(240, openSheet);
      }
    };
    S.on(shutter, 'click', shoot);
    if (sheet) {
      S.on($(sheet, '.m-micro-cam-again'), 'click', function () {
        const out = S.anim(sheet, o.reduced ? [{ opacity: 1 }, { opacity: 0 }] : [{ transform: 'translateY(0)' }, { transform: 'translateY(100%)' }], { duration: o.reduced ? 150 : 140, easing: 'ease-in', fill: 'forwards' });
        S.after(150, function () { sheet.hidden = true; if (out) out.cancel(); root.classList.remove('is-dim'); shutter.focus({ preventScroll: true }); });
      });
    }
    S.after(900, shoot);
    return S.stop;
  });

  /* ---------- micro.done (A and B are pure CSS) ---------- */
  reg('micro.done', function (stage, v, o) {
    if (v !== 'C') return undefined;
    const S = scope();
    const root = $(stage, '.m-micro-done');
    const btn = $(root, '.m-micro-done-btn');
    const text = $(root, '.m-micro-done-text');
    let st = 'idle';
    const send = function () {
      if (st === 'busy') return;
      if (st === 'sent') {
        st = 'idle';
        root.classList.remove('is-sent');
        text.innerHTML = '';
        btn.setAttribute('aria-label', 'Göndər');
        return;
      }
      st = 'busy';
      root.classList.add('is-busy');
      btn.setAttribute('aria-label', 'Göndərilir');
      S.after(o.reduced ? 300 : 1100, function () {
        st = 'sent';
        root.classList.remove('is-busy');
        root.classList.add('is-sent');
        btn.setAttribute('aria-label', 'Göndərildi. Yenidən başlamaq üçün toxun');
        text.innerHTML = '<b>Sualın göndərildi</b><span>Müəllim yoxlayanda xəbər verəcəyik.</span>';
        S.anim(text, o.reduced ? [{ opacity: 0 }, { opacity: 1 }] : [{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], { duration: o.reduced ? 150 : 220, delay: o.reduced ? 0 : 200, easing: EOUT, fill: 'backwards' });
      });
    };
    let autoT = null;
    S.on(btn, 'click', function () { if (autoT) S.clear(autoT); send(); });
    autoT = S.after(900, function () {
      btn.classList.add('is-down');
      S.after(130, function () { btn.classList.remove('is-down'); send(); });
    });
    return S.stop;
  });

  /* ---------- micro.pill ---------- */
  reg('micro.pill', function (stage, v, o) {
    const S = scope();
    const root = $(stage, '.m-micro-status');
    const slot = $(root, '.m-micro-pill-slot');
    const meta = $(root, '.m-micro-pill-meta');
    const go = $(root, '.m-micro-pill-go');
    const AI = '<span class="m-micro-hexic m-micro-pill-hex"></span><span>AI cavabı · yoxlanır</span>';
    const OK = SVG('<path pathLength="1" d="M5 12.5l4.5 4.5L19 7.5"/>', 16) + '<span>Müəllim təsdiqlədi</span>';
    let approved = false;
    let busy = false;
    const make = function (ok) {
      const p = document.createElement('span');
      p.className = 'm-micro-pill ' + (ok ? 'is-ok' : 'is-ai');
      p.innerHTML = ok ? OK : AI;
      return p;
    };
    const draw = function (p, delay) {
      const path = $(p, 'path');
      if (path && !o.reduced) S.anim(path, [{ strokeDashoffset: 1 }, { strokeDashoffset: 0 }], { duration: 220, delay: delay, easing: EOUT, fill: 'backwards' });
    };
    const crossfade = function (ok) {
      const old = $(slot, '.m-micro-pill');
      const w0 = old.offsetWidth;
      const nu = make(ok);
      slot.appendChild(nu);
      if (o.reduced) { old.remove(); S.anim(nu, [{ opacity: 0 }, { opacity: 1 }], { duration: 150 }); return; }
      S.anim(slot, [{ width: w0 + 'px' }, { width: nu.offsetWidth + 'px' }], { duration: 220, easing: EOUT });
      S.anim(old, [{ opacity: 1 }, { opacity: 0 }], { duration: 120, easing: 'ease-in', fill: 'forwards' });
      S.anim(nu, [{ opacity: 0 }, { opacity: 1 }], { duration: 220, easing: 'ease-out' });
      S.after(220, function () { old.remove(); });
      if (ok) draw(nu, 100);
    };
    const flip = function (ok) {
      const old = $(slot, '.m-micro-pill');
      S.anim(old, [{ transform: 'rotateX(0deg)' }, { transform: 'rotateX(90deg)' }], { duration: 160, easing: 'ease-in', fill: 'forwards' });
      S.after(160, function () {
        old.remove();
        const nu = make(ok);
        slot.appendChild(nu);
        S.anim(nu, [{ transform: 'rotateX(-90deg)' }, { transform: 'rotateX(0deg)' }], { duration: 200, easing: EOUT });
        if (ok) draw(nu, 160);
      });
    };
    const stamp = function () {
      const old = $(slot, '.m-micro-pill');
      const w0 = old.offsetWidth;
      const nu = make(true);
      slot.appendChild(nu);
      const rip = document.createElement('span');
      rip.className = 'm-micro-pill-ripple';
      slot.appendChild(rip);
      S.anim(rip, [{ transform: 'scale(.4)', opacity: 0.8 }, { transform: 'scale(2.2)', opacity: 0 }], { duration: 400, easing: 'ease-out', fill: 'forwards' });
      S.anim(nu, [{ clipPath: 'inset(0 100% 0 0 round 999px)' }, { clipPath: 'inset(0 0 0 0 round 999px)' }], { duration: 300, easing: 'cubic-bezier(.65,0,.35,1)', fill: 'backwards' });
      S.anim(slot, [{ width: w0 + 'px' }, { width: nu.offsetWidth + 'px' }], { duration: 300, easing: 'cubic-bezier(.65,0,.35,1)' });
      draw(nu, 220);
      S.after(300, function () { old.remove(); pop(S, nu, 1.06); });
      S.after(420, function () { rip.remove(); });
    };
    const set = function (ok) {
      if (busy || ok === approved) return;
      busy = true;
      approved = ok;
      meta.textContent = ok ? 'Lalə Həsənova · indicə' : '4.3 · Cəmin və fərqin kubu · bu gün 16:40';
      go.textContent = ok ? 'Yenidən: yoxlanır' : 'Müəllim təsdiqləsin';
      if (!ok || o.reduced || v === 'A') crossfade(ok);
      else if (v === 'B') flip(ok);
      else stamp();
      S.after(560, function () { busy = false; });
    };
    let autoT = null;
    S.on(go, 'click', function () { if (autoT) S.clear(autoT); set(!approved); });
    autoT = S.after(1800, function () { set(true); });
    return S.stop;
  });

})();
</script>

<script>
// Lab runtime: renders sample cards from <article class="sample"> + <template data-variant>,
// mounts the chosen variant, replays it, and keeps decisions in the db capability.
(function () {
  const mounts = window.Lab._mounts;
  let reduced = window.Lab._reduced;

  const state = new Map(); // sampleId -> {variant, status, note}
  const cards = [];

  function mount(card) {
    const id = card.dataset.id;
    const v = card.dataset.current;
    const tpl = card.querySelector(`template[data-variant="${v}"]`);
    const stage = card.querySelector('.stage');
    if (card._cleanup) { try { card._cleanup(); } catch (e) { /* ignore */ } card._cleanup = null; }
    if (window.gsap) gsap.killTweensOf(stage.querySelectorAll('*'));
    stage.replaceChildren(tpl ? tpl.content.cloneNode(true) : document.createTextNode(''));
    const fn = mounts.get(id);
    if (fn) { try { const c = fn(stage, v, { reduced }); if (typeof c === 'function') card._cleanup = c; } catch (e) { console.error(id, e); } }
    const spec = card.querySelector('.spec');
    spec.textContent = tpl ? (tpl.dataset.spec || '') : '';
  }

  function decisionText(d) {
    if (!d || !d.status) return 'Hələ qərar yoxdur';
    if (d.status === 'approved') return `Təsdiqləndi: variant ${d.variant}`;
    if (d.status === 'updated') return `Yeniləndi: qeydinizə görə variant ${d.variant} dəyişdirildi — yenidən baxın`;
    return `Dəyişiklik istənildi (variant ${d.variant})`;
  }

  function renderDecision(card) {
    const d = state.get(card.dataset.id);
    const approve = card.querySelector('.approve');
    const change = card.querySelector('.change');
    const note = card.querySelector('textarea');
    const label = card.querySelector('.decide .state');
    approve.setAttribute('aria-pressed', d && d.status === 'approved' ? 'true' : 'false');
    change.setAttribute('aria-pressed', d && d.status === 'change' ? 'true' : 'false');
    const asked = !!(d && (d.status === 'change' || d.status === 'updated'));
    note.hidden = !asked && !note.value;
    card.classList.toggle('is-updated', !!(d && d.status === 'updated'));
    if (d && typeof d.note === 'string' && document.activeElement !== note) note.value = d.note;
    label.textContent = decisionText(d);
    label.classList.toggle('ok', !!(d && d.status === 'approved'));
    label.classList.toggle('updated', !!(d && d.status === 'updated'));
    updateProgress();
  }

  function updateProgress() {
    const done = cards.filter((c) => state.get(c.dataset.id)?.status === 'approved').length;
    document.getElementById('progress').textContent = `${done} / ${cards.length} təsdiq`;
    const updated = cards.filter((c) => state.get(c.dataset.id)?.status === 'updated');
    const chip = document.getElementById('updated');
    chip.hidden = updated.length === 0;
    chip.querySelector('.count').textContent = String(updated.length);
    document.querySelectorAll('#cats .chip').forEach((chip) => {
      const sec = document.getElementById(chip.dataset.target);
      const list = [...sec.querySelectorAll('.sample')];
      const ok = list.filter((c) => state.get(c.dataset.id)?.status === 'approved').length;
      chip.querySelector('.count').textContent = `${ok}/${list.length}`;
    });
  }

  let db = null;
  async function save(id, patch) {
    const next = { ...(state.get(id) || {}), ...patch, at: new Date().toISOString() };
    state.set(id, next);
    const card = cards.find((c) => c.dataset.id === id);
    if (card) renderDecision(card);
    if (!db) return;
    try { await db.doc('decisions/' + id.replaceAll('.', '__')).set({ id, ...next }); }
    catch (e) { card && (card.querySelector('.decide .state').textContent = 'Yadda saxlanmadı, yenidən cəhd et'); }
  }

  function build(card) {
    const id = card.dataset.id;
    const tpls = [...card.querySelectorAll('template[data-variant]')];
    card.dataset.current = tpls[0]?.dataset.variant || 'A';
    const head = document.createElement('div');
    head.className = 'sample-head';
    head.innerHTML = `<h3></h3><span class="when"></span>`;
    head.querySelector('h3').textContent = card.dataset.title || id;
    head.querySelector('.when').textContent = card.dataset.when || '';
    const variants = document.createElement('div');
    variants.className = 'variants';
    variants.setAttribute('role', 'group');
    variants.setAttribute('aria-label', 'Variantlar');
    tpls.forEach((t) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'variant';
      b.dataset.v = t.dataset.variant;
      b.innerHTML = `<span class="tag"></span><span class="name"></span>`;
      b.querySelector('.tag').textContent = t.dataset.variant;
      b.querySelector('.name').textContent = t.dataset.label || '';
      b.setAttribute('aria-pressed', String(t.dataset.variant === card.dataset.current));
      b.addEventListener('click', () => {
        card.dataset.current = t.dataset.variant;
        variants.querySelectorAll('.variant').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
        mount(card);
      });
      variants.appendChild(b);
    });
    const wrap = document.createElement('div');
    wrap.className = 'stage-wrap';
    wrap.innerHTML = `<div class="stage"></div><button class="replay" type="button">Yenidən oynat</button>`;
    wrap.querySelector('.replay').addEventListener('click', () => mount(card));
    // The porting spec (timings, easing, the React Native build) is for developers: folded away.
    const specBox = document.createElement('details');
    specBox.className = 'spec-box';
    specBox.innerHTML = '<summary>Texniki qeyd · proqramçı üçün</summary>';
    const spec = document.createElement('p');
    spec.className = 'spec';
    specBox.append(spec);
    const decide = document.createElement('div');
    decide.className = 'decide';
    decide.innerHTML = `<div class="decide-row"><button type="button" class="approve">Seçilmiş variantı təsdiqlə</button><button type="button" class="change">Dəyişiklik lazımdır</button><span class="state"></span></div><textarea aria-label="Nə dəyişməlidir?" placeholder="Nə dəyişməlidir? (məs. daha yavaş, daha az sıçrayış)"></textarea>`;
    decide.querySelector('.approve').addEventListener('click', () => save(id, { status: 'approved', variant: card.dataset.current }));
    decide.querySelector('.change').addEventListener('click', () => { save(id, { status: 'change', variant: card.dataset.current }); decide.querySelector('textarea').hidden = false; decide.querySelector('textarea').focus(); });
    let timer;
    decide.querySelector('textarea').addEventListener('input', (e) => { clearTimeout(timer); const v = e.target.value; timer = setTimeout(() => save(id, { note: v, status: state.get(id)?.status || 'change', variant: card.dataset.current }), 600); });
    card.prepend(head);
    card.append(variants, wrap, specBox, decide);
    cards.push(card);
    renderDecision(card);
    mount(card);
  }

  function init() {
    const cats = document.getElementById('cats');
    document.querySelectorAll('.lab-section').forEach((sec) => {
      const h = document.createElement('h2');
      h.textContent = sec.dataset.title || sec.id;
      const lead = document.createElement('p');
      lead.className = 'lead';
      lead.textContent = sec.dataset.lead || '';
      sec.prepend(h, lead);
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip';
      chip.dataset.target = sec.id;
      chip.innerHTML = `<span class="name"></span><span class="count"></span>`;
      chip.querySelector('.name').textContent = sec.dataset.title || sec.id;
      chip.addEventListener('click', () => sec.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth' }));
      cats.appendChild(chip);
      sec.querySelectorAll('.sample').forEach(build);
    });
    const rb = document.getElementById('reduced');
    const setReduced = (on) => { reduced = on; window.Lab._reduced = on; document.documentElement.toggleAttribute('data-reduced', on); rb.setAttribute('aria-pressed', String(on)); cards.forEach(mount); };
    rb.addEventListener('click', () => setReduced(!reduced));
    setReduced(reduced);
    const tb = document.getElementById('theme');
    tb.addEventListener('click', () => {
      const dark = document.documentElement.dataset.theme !== 'dark' && !(matchMedia('(prefers-color-scheme: dark)').matches && document.documentElement.dataset.theme !== 'light');
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      tb.textContent = dark ? 'Açıq' : 'Tünd';
      tb.setAttribute('aria-pressed', String(dark));
    });
    updateProgress();
    connect();
  }

  let nextUpdated = 0;
  document.getElementById('updated').addEventListener('click', () => {
    const list = cards.filter((c) => state.get(c.dataset.id)?.status === 'updated');
    if (!list.length) return;
    const card = list[nextUpdated++ % list.length];
    card.scrollIntoView({ behavior: reduced ? 'auto' : 'smooth', block: 'start' });
  });

  async function connect() {
    try { db = await window.claude?.use?.('db'); } catch (e) { db = null; }
    if (!db) return;
    try {
      db.collection('decisions').onSnapshot((snap) => {
        const docs = snap?.docs || snap || [];
        docs.forEach((d) => { const data = typeof d.data === 'function' ? d.data() : (d.data || d); if (data && data.id) state.set(data.id, data); });
        cards.forEach((card) => {
          // Show the variant the decision was about, the first time it arrives.
          const v = state.get(card.dataset.id)?.variant;
          if (!card._restored && v && v !== card.dataset.current && card.querySelector(`template[data-variant="${v}"]`)) {
            card._restored = true;
            card.dataset.current = v;
            card.querySelectorAll('.variant').forEach((x) => x.setAttribute('aria-pressed', String(x.dataset.v === v)));
            mount(card);
          }
        });
        cards.forEach(renderDecision);
      });
    } catch (e) { /* the page works without saved decisions */ }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
